<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Audio Playlist Player</title>
<style>
  :root{
    --bg:#0d0f14;
    --panel:#161922;
    --panel-2:#1d2230;
    --line:#262c3a;
    --line-hi:#3a4258;
    --text:#e9ecf3;
    --muted:#8a93a8;
    --accent:#4f8cff;
    --accent-2:#8b5cff;
    --panel-alpha: 0.90;
    --bg-dim: 0.65;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html{ -webkit-text-size-adjust:100%; }
  html, body{ margin:0; }

  body{
    min-height:100vh;
    min-height:100dvh;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color:var(--text);
    background:var(--bg);
    display:flex;
    justify-content:center;
    padding:28px 16px calc(48px + env(safe-area-inset-bottom));
    position:relative;
  }
  body.no-scroll{ overflow:hidden; }

  /* -------- Fixed background -------- */
  #bg{
    position:fixed; inset:0; z-index:-1;
    background-color:var(--bg);
    background-image:var(--bg-image, none);
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    pointer-events:none;
  }
  #bg::before{
    content:''; position:absolute; inset:0;
    background:
      radial-gradient(900px 500px at 10% -10%, rgba(79,140,255,.18), transparent 60%),
      radial-gradient(800px 500px at 110% 0%, rgba(139,92,255,.16), transparent 60%);
    pointer-events:none;
  }
  #bg::after{
    content:''; position:absolute; inset:0;
    background:linear-gradient(
      rgb(13 15 20 / calc(var(--bg-dim) * 0.85)),
      rgb(13 15 20 / var(--bg-dim))
    );
    pointer-events:none;
    transition:background .18s ease;
  }

  .app{ width:100%; max-width:800px; position:relative; z-index:1; }

  /* -------- Topbar -------- */
  .topbar{ margin-bottom:18px; }
  h1{ font-size:1.55rem; margin:0 0 4px; letter-spacing:-.01em; }
  .sub{ margin:0; color:var(--muted); font-size:.93rem; }

  /* Hide everything except the play bar */
  body.minimal .topbar{ display:none; }
  body.minimal .playlist-panel{ display:none; }

  /* -------- Player card -------- */
  .player{
    position:relative;
    background:rgba(22,25,34, var(--panel-alpha));
    -webkit-backdrop-filter:blur(10px);
    backdrop-filter:blur(10px);
    border:1px solid var(--line);
    border-radius:16px;
    padding:16px;
    transition:background-color .18s ease;
  }

  .player-corner{
    position:absolute;
    top:10px; right:10px;
    display:flex; gap:6px;
    z-index:2;
  }
  .icon-btn{
    background:rgba(29,34,48,.85);
    border:1px solid var(--line);
    color:var(--text);
    width:34px; height:34px;
    border-radius:9px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    font-size:.95rem;
    cursor:pointer;
    transition:.15s;
    padding:0;
    font-family:inherit;
  }
  .icon-btn:hover{ background:rgba(40,48,66,.95); border-color:var(--line-hi); }

  .now{ padding-right:84px; }
  .now-title{
    font-weight:600;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .now-sub{ color:var(--muted); font-size:.8rem; margin-top:3px; }

  .progress-row{ display:flex; align-items:center; gap:10px; margin:14px 0 10px; }
  .time{
    font-size:.75rem; color:var(--muted);
    font-variant-numeric:tabular-nums; min-width:38px; text-align:center;
  }

  input[type="range"]{
    -webkit-appearance:none; appearance:none;
    height:4px; border-radius:999px;
    background:var(--line); outline:none; cursor:pointer;
    touch-action:pan-y;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:16px; height:16px; border-radius:50%; border:0;
    background:linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow:0 0 0 3px rgba(79,140,255,.16);
  }
  input[type="range"]::-moz-range-thumb{
    width:16px; height:16px; border:0; border-radius:50%;
    background:linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow:0 0 0 3px rgba(79,140,255,.16);
  }
  #seek{ flex:1; }

  .controls{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .ctrl{
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:12px;
    padding:10px 13px;
    font-size:1rem;
    font-family:inherit;
    cursor:pointer;
    display:inline-flex; align-items:center; gap:6px;
    transition:.15s; touch-action:manipulation;
  }
  .ctrl:hover{ background:#232a3a; border-color:var(--line-hi); }

  .ctrl.play{
    width:50px; height:50px; border-radius:50%;
    justify-content:center; font-size:1.05rem;
    background:linear-gradient(135deg, var(--accent), var(--accent-2));
    border:0; color:#fff;
    box-shadow:0 6px 18px rgba(79,140,255,.35);
  }
  .ctrl.play:hover{ filter:brightness(1.08); }

  .ctrl.loop .loop-label{
    font-size:.75rem; color:var(--muted);
    font-variant-numeric:tabular-nums;
  }
  .ctrl.loop.on{
    border-color:var(--accent);
    background:rgba(79,140,255,.12);
    color:var(--accent);
  }
  .ctrl.loop.on .loop-label{ color:var(--accent); }

  .vol{ margin-left:auto; display:flex; align-items:center; gap:8px; color:var(--muted); }
  .vol input{ width:90px; }

  @media (max-width:520px){
    .vol{ margin-left:0; width:100%; }
    .vol input{ flex:1; width:auto; }
  }

  /* -------- Playlist panel (main screen) -------- */
  .panel{
    margin-top:16px;
    background:rgba(22,25,34, var(--panel-alpha));
    -webkit-backdrop-filter:blur(10px);
    backdrop-filter:blur(10px);
    border:1px solid var(--line);
    border-radius:16px;
    overflow:hidden;
    transition:background-color .18s ease;
  }
  .panel-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 16px;
    border-bottom:1px solid var(--line);
  }
  .panel-head h2{
    margin:0; font-size:1rem; font-weight:600;
    display:flex; align-items:center; gap:8px;
  }
  .count{
    background:var(--panel-2); color:var(--muted);
    font-size:.72rem; padding:2px 8px; border-radius:999px;
    font-variant-numeric:tabular-nums;
  }
  .ghost{
    background:transparent; border:1px solid var(--line);
    color:var(--muted); padding:7px 11px; border-radius:10px;
    cursor:pointer; font-size:.8rem; font-family:inherit; transition:.15s;
  }
  .ghost:hover{ color:var(--text); border-color:var(--line-hi); }

  .playlist{
    list-style:none; margin:0; padding:6px;
    max-height:340px; overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }
  .playlist::-webkit-scrollbar{ width:10px; }
  .playlist::-webkit-scrollbar-thumb{
    background:var(--line); border-radius:999px; border:3px solid transparent;
    background-clip:padding-box;
  }

  .track{
    display:flex; align-items:center; gap:10px;
    padding:10px 12px; border-radius:10px;
    cursor:pointer; transition:background .15s;
  }
  .track:hover{ background:rgba(255,255,255,.04); }
  .track.active{
    background:linear-gradient(90deg, rgba(79,140,255,.22), rgba(139,92,255,.12));
  }
  .track .idx{
    width:22px; text-align:center; color:var(--muted);
    font-size:.8rem; font-variant-numeric:tabular-nums; flex:none;
  }
  .track.active .idx{ color:var(--accent); }
  .track .name{
    flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    font-size:.94rem;
  }
  .track.active .name{ font-weight:600; }
  .track .remove{
    background:transparent; border:0; color:var(--muted);
    cursor:pointer; font-size:.95rem; padding:6px 9px;
    border-radius:8px; opacity:.55; flex:none;
    transition:.15s; font-family:inherit; line-height:1;
  }
  .track .remove:hover{
    color:#ff6b6b; background:rgba(255,107,107,.14); opacity:1;
  }
  .empty{
    padding:24px 16px; text-align:center; color:var(--muted); font-size:.9rem;
  }

  /* -------- Sidebar / drawer -------- */
  #scrim{
    position:fixed; inset:0; background:rgba(0,0,0,.55);
    opacity:0; pointer-events:none;
    transition:opacity .25s ease; z-index:40;
  }
  #scrim.show{ opacity:1; pointer-events:auto; }

  #sidebar{
    position:fixed; top:0; right:0;
    height:100vh; height:100dvh;
    width:min(420px, 92vw);
    background:rgba(16,18,26,.96);
    -webkit-backdrop-filter:blur(14px);
    backdrop-filter:blur(14px);
    border-left:1px solid var(--line);
    z-index:50;
    transform:translateX(100%);
    transition:transform .28s cubic-bezier(.2,.8,.2,1);
    display:flex; flex-direction:column;
    box-shadow:-16px 0 40px rgba(0,0,0,.5);
    padding-bottom:env(safe-area-inset-bottom);
  }
  #sidebar.open{ transform:translateX(0); }

  .sidebar-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px; border-bottom:1px solid var(--line); flex:none;
  }
  .sidebar-head h2{ margin:0; font-size:1rem; font-weight:600; }

  .sidebar-body{
    padding:16px; overflow-y:auto; -webkit-overflow-scrolling:touch;
    flex:1; display:flex; flex-direction:column; gap:10px;
  }
  .sidebar-body h3{
    margin:14px 0 2px; font-size:.78rem;
    text-transform:uppercase; letter-spacing:.08em;
    color:var(--muted); font-weight:600;
  }
  .sidebar-body h3:first-child{ margin-top:0; }

  .row-between{ display:flex; align-items:center; justify-content:space-between; gap:8px; }

  .setting-row{
    display:flex; align-items:center; gap:10px;
    padding:6px 0; font-size:.88rem;
  }
  .setting-row > span:first-child{ flex:1; }
  .setting-row input[type="range"]{ flex:1.2; }
  #alphaVal, #dimVal{
    min-width:40px; text-align:right; color:var(--muted);
    font-variant-numeric:tabular-nums; font-size:.8rem;
  }

  /* -------- Drop zone -------- */
  .drop{
    display:flex; flex-direction:column; align-items:center; gap:6px;
    padding:22px 16px;
    border:2px dashed var(--line); border-radius:14px;
    background:rgba(255,255,255,.03);
    cursor:pointer; text-align:center;
    transition:border-color .18s, background .18s, transform .18s;
    user-select:none; -webkit-user-select:none;
  }
  .drop:hover, .drop.over{
    border-color:var(--accent); background:rgba(79,140,255,.10);
  }
  .drop.over{ transform:scale(1.01); }
  .drop-icon{ font-size:1.5rem; line-height:1; }
  .hint{ color:var(--muted); font-size:.76rem; }
  .hint-ios{ display:none; color:var(--muted); font-size:.74rem; margin-top:2px; }
  .ios .hint-ios{ display:block; }
</style>
</head>
<body>

<div id="bg"></div>

<div class="app">
  <header class="topbar">
    <!-- <h1>Audio Playlist</h1> -->
    <!-- <p class="sub">Tap ▶ to play · ⚙ for settings · ▴ to hide everything except the play bar</p> -->
  </header>

  <!-- Main play bar -->
  <section class="player">
    <div class="player-corner">
      <button id="settingsBtn" class="icon-btn" type="button" aria-label="Settings" title="Settings">⚙</button>
      <button id="hideBtn" class="icon-btn" type="button" aria-label="Hide playlist" title="Hide playlist">▴</button>
    </div>

    <div class="now">
      <div id="nowTitle" class="now-title">No track selected</div>
      <div id="nowSub" class="now-sub">Open settings to add audio files</div>
    </div>

    <div class="progress-row">
      <span id="curTime" class="time">0:00</span>
      <input id="seek" type="range" min="0" max="1000" step="1" value="0" aria-label="Seek">
      <span id="durTime" class="time">0:00</span>
    </div>

    <div class="controls">
      <button id="prevBtn" class="ctrl" type="button" title="Previous" aria-label="Previous">⏮</button>
      <button id="playBtn" class="ctrl play" type="button" title="Play / Pause" aria-label="Play">▶</button>
      <button id="nextBtn" class="ctrl" type="button" title="Next" aria-label="Next">⏭</button>
      <button id="loopBtn" class="ctrl loop" type="button" title="Repeat: Off" aria-label="Repeat mode">
        <span class="loop-icon">🔁</span><span class="loop-label">Off</span>
      </button>
      <div class="vol">
        <span class="vol-icon">🔊</span>
        <input id="volume" type="range" min="0" max="1" step="0.01" value="1" aria-label="Volume">
      </div>
    </div>
  </section>

  <!-- Playlist -->
  <section class="panel playlist-panel">
    <div class="panel-head">
      <h2>Playlist <span id="count" class="count">0</span></h2>
      <button id="clearBtn" class="ghost" type="button">Clear all</button>
    </div>
    <ul id="playlist" class="playlist"></ul>
  </section>
</div>

<!-- Scrim + settings sidebar -->
<div id="scrim"></div>

<aside id="sidebar" aria-label="Settings" aria-hidden="true">
  <div class="sidebar-head">
    <h2>Settings</h2>
    <button id="closeSidebar" class="icon-btn" type="button" aria-label="Close">✕</button>
  </div>

  <div class="sidebar-body">
    <h3>Appearance</h3>
    <div class="row-between" style="flex-wrap:wrap">
      <button id="bgBtn" class="ghost" type="button">🖼 Set background image</button>
      <button id="bgClearBtn" class="ghost" type="button" hidden>✕ Remove background</button>
    </div>
    <label class="setting-row" for="dim">
      <span>Background dim</span>
      <input id="dim" type="range" min="0" max="100" step="1" value="65">
      <span id="dimVal">65%</span>
    </label>
    <label class="setting-row" for="alpha">
      <span>Panel transparency</span>
      <input id="alpha" type="range" min="0" max="80" step="1" value="10">
      <span id="alphaVal">10%</span>
    </label>

    <h3>Upload songs</h3>
    <label id="drop" class="drop" for="fileInput">
      <span class="drop-icon">⬆</span>
      <span><strong>Tap to upload</strong> or drop audio files here</span>
      <span class="hint">mp3 · wav · ogg · m4a · flac · aac …</span>
      <span class="hint-ios">On iPhone: tap above, then <em>Select</em> in Files to pick multiple.</span>
    </label>
    <input
      id="fileInput"
      type="file"
      accept="audio/*,.mp3,.m4a,.aac,.wav,.ogg,.oga,.opus,.flac,.weba,.webm,.aiff,.aif,.wma"
      multiple
      hidden>
  </div>
</aside>

<input id="bgInput" type="file" accept="image/*" hidden>
<audio id="audio" preload="metadata" playsinline webkit-playsinline></audio>

<script>
(() => {
  "use strict";

  const els = {
    audio:        document.getElementById('audio'),
    fileInput:    document.getElementById('fileInput'),
    drop:         document.getElementById('drop'),
    playlist:     document.getElementById('playlist'),
    count:        document.getElementById('count'),
    clearBtn:     document.getElementById('clearBtn'),
    nowTitle:     document.getElementById('nowTitle'),
    nowSub:       document.getElementById('nowSub'),
    curTime:      document.getElementById('curTime'),
    durTime:      document.getElementById('durTime'),
    seek:         document.getElementById('seek'),
    playBtn:      document.getElementById('playBtn'),
    prevBtn:      document.getElementById('prevBtn'),
    nextBtn:      document.getElementById('nextBtn'),
    loopBtn:      document.getElementById('loopBtn'),
    volume:       document.getElementById('volume'),
    bgBtn:        document.getElementById('bgBtn'),
    bgClearBtn:   document.getElementById('bgClearBtn'),
    bgInput:      document.getElementById('bgInput'),
    settingsBtn:  document.getElementById('settingsBtn'),
    hideBtn:      document.getElementById('hideBtn'),
    closeSidebar: document.getElementById('closeSidebar'),
    sidebar:      document.getElementById('sidebar'),
    scrim:        document.getElementById('scrim'),
    alpha:        document.getElementById('alpha'),
    alphaVal:     document.getElementById('alphaVal'),
    dim:          document.getElementById('dim'),
    dimVal:       document.getElementById('dimVal')
  };

  const AUDIO_EXT = /\.(mp3|wav|ogg|oga|m4a|aac|flac|opus|weba|webm|aiff?|wma)$/i;
  const LOOP_LABELS = { off: 'Off', all: 'All', one: 'One' };

  /* ---- IndexedDB persistence ---- */
  const DB_NAME = 'audio-playlist', STORE = 'tracks', SETTINGS = 'settings';
  let dbPromise = null;
  function db(){
    if (!dbPromise) dbPromise = new Promise((res, rej) => {
      const r = indexedDB.open(DB_NAME, 2);
      r.onupgradeneeded = () => {
        const d = r.result;
        if (!d.objectStoreNames.contains(STORE))    d.createObjectStore(STORE, { keyPath:'key' });
        if (!d.objectStoreNames.contains(SETTINGS)) d.createObjectStore(SETTINGS, { keyPath:'key' });
      };
      r.onsuccess = () => res(r.result);
      r.onerror   = () => rej(r.error);
    });
    return dbPromise;
  }
  function dbPut(rec){ return db().then(d => new Promise((res, rej) => {
    const tx = d.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).put(rec);
    tx.oncomplete = res; tx.onerror = () => rej(tx.error);
  })); }
  function dbDelete(key){ return db().then(d => new Promise((res, rej) => {
    const tx = d.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).delete(key);
    tx.oncomplete = res; tx.onerror = () => rej(tx.error);
  })); }
  function dbAll(){ return db().then(d => new Promise((res, rej) => {
    const req = d.transaction(STORE, 'readonly').objectStore(STORE).getAll();
    req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error);
  })); }
  function dbClear(){ return db().then(d => new Promise((res, rej) => {
    const tx = d.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).clear();
    tx.oncomplete = res; tx.onerror = () => rej(tx.error);
  })); }
  function setGet(key){ return db().then(d => new Promise((res, rej) => {
    const req = d.transaction(SETTINGS, 'readonly').objectStore(SETTINGS).get(key);
    req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error);
  })); }
  function setPut(rec){ return db().then(d => new Promise((res, rej) => {
    const tx = d.transaction(SETTINGS, 'readwrite');
    tx.objectStore(SETTINGS).put(rec);
    tx.oncomplete = res; tx.onerror = () => rej(tx.error);
  })); }
  function setDelete(key){ return db().then(d => new Promise((res, rej) => {
    const tx = d.transaction(SETTINGS, 'readwrite');
    tx.objectStore(SETTINGS).delete(key);
    tx.oncomplete = res; tx.onerror = () => rej(tx.error);
  })); }

  const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                 (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (IS_IOS) document.documentElement.classList.add('ios');

  let tracks = [];
  let current = -1;
  let loopMode = 'off';
  let uid = 0;

  let bgUrl = null;
  let bgArtwork = [];
  let fallbackArtwork = [];

  function makeFallbackArtwork() {
    try {
      fallbackArtwork = [512, 1024, 1536].map((s) => {
        const c = document.createElement('canvas');
        c.width = c.height = s;
        const g = c.getContext('2d');
        const grad = g.createLinearGradient(0, 0, s, s);
        grad.addColorStop(0, '#4f8cff');
        grad.addColorStop(1, '#8b5cff');
        g.fillStyle = grad;
        g.fillRect(0, 0, s, s);
        g.fillStyle = 'rgba(255,255,255,.92)';
        g.font = `${Math.round(s * 0.51)}px system-ui, -apple-system, sans-serif`;
        g.textAlign = 'center';
        g.textBaseline = 'middle';
        g.fillText('♪', s / 2, s / 2 + s * 0.04);
        return { src: c.toDataURL('image/png'), sizes: `${s}x${s}`, type: 'image/png' };
      });
    } catch (e) { fallbackArtwork = []; }
  }
  makeFallbackArtwork();

  /* ------------------------------------------------------------------ */
  /*  Helpers                                                            */
  /* ------------------------------------------------------------------ */

  function fmt(seconds) {
    if (!isFinite(seconds) || seconds < 0) return '0:00';
    const m = Math.floor(seconds / 60);
    const s = Math.floor(seconds % 60);
    return m + ':' + String(s).padStart(2, '0');
  }

  function setPlayIcon(isPlaying) {
    els.playBtn.textContent = isPlaying ? '⏸' : '▶';
    els.playBtn.setAttribute('aria-label', isPlaying ? 'Pause' : 'Play');
  }

  function updateNowPlaying() {
    if (current >= 0 && tracks[current]) {
      els.nowTitle.textContent = tracks[current].name;
      els.nowSub.textContent = `Track ${current + 1} of ${tracks.length}`;
      document.title = tracks[current].name + ' — Audio Playlist';
    } else {
      els.nowTitle.textContent = 'No track selected';
      els.nowSub.textContent = tracks.length
        ? 'Pick a track from the playlist'
        : 'Open settings to add audio files';
      document.title = 'Audio Playlist Player';
    }
    els.count.textContent = String(tracks.length);
  }

  /* ------------------------------------------------------------------ */
  /*  Sidebar + minimize                                                 */
  /* ------------------------------------------------------------------ */

  function openSidebar() {
    els.sidebar.classList.add('open');
    els.sidebar.setAttribute('aria-hidden', 'false');
    els.scrim.classList.add('show');
    document.body.classList.add('no-scroll');
  }
  function closeSidebar() {
    els.sidebar.classList.remove('open');
    els.sidebar.setAttribute('aria-hidden', 'true');
    els.scrim.classList.remove('show');
    document.body.classList.remove('no-scroll');
  }

  function setMinimal(on) {
    document.body.classList.toggle('minimal', on);
    els.hideBtn.textContent = on ? '▾' : '▴';
    const label = on ? 'Show playlist' : 'Hide playlist';
    els.hideBtn.setAttribute('aria-label', label);
    els.hideBtn.title = label;
  }

  /* ------------------------------------------------------------------ */
  /*  Media Session                                                      */
  /* ------------------------------------------------------------------ */

  function updateMediaSession() {
    if (!('mediaSession' in navigator)) return;
    const ms = navigator.mediaSession;
    if (current < 0 || !tracks[current]) {
      try { ms.metadata = null; } catch (e) {}
      try { ms.playbackState = 'none'; } catch (e) {}
      return;
    }
    const t = tracks[current];
    const art = (bgArtwork && bgArtwork.length) ? bgArtwork : fallbackArtwork;
    try {
      if (typeof MediaMetadata !== 'undefined') {
        ms.metadata = new MediaMetadata({
          title: t.name,
          artist: 'Audio Playlist',
          album: tracks.length + ' track' + (tracks.length === 1 ? '' : 's'),
          artwork: art
        });
      }
    } catch (e) {}
    try { ms.playbackState = els.audio.paused ? 'paused' : 'playing'; } catch (e) {}
  }

  function updatePositionState() {
    if (!('mediaSession' in navigator)) return;
    if (typeof navigator.mediaSession.setPositionState !== 'function') return;
    const d = els.audio.duration;
    if (!isFinite(d) || d <= 0) return;
    try {
      navigator.mediaSession.setPositionState({
        duration: d,
        playbackRate: els.audio.playbackRate || 1,
        position: Math.min(d, Math.max(0, els.audio.currentTime || 0))
      });
    } catch (e) {}
  }

  function initMediaSession() {
    if (!('mediaSession' in navigator)) return;
    const ms = navigator.mediaSession;
    const safe = (action, fn) => { try { ms.setActionHandler(action, fn); } catch (e) {} };

    safe('play', () => {
      if (current === -1) { playTrack(0); return; }
      const p = els.audio.play();
      if (p && typeof p.catch === 'function') p.catch(() => {});
    });
    safe('pause', () => els.audio.pause());
    safe('previoustrack', () => prevTrack());
    safe('nexttrack', () => nextTrack(false));
    safe('seekbackward', (d) => seekBy(-((d && d.seekOffset) || 10)));
    safe('seekforward',  (d) => seekBy(  (d && d.seekOffset) || 10));
    safe('seekto', (d) => {
      if (!d || typeof d.seekTime !== 'number') return;
      try { els.audio.currentTime = d.seekTime; } catch (e) {}
      updatePositionState();
    });
    safe('stop', () => {
      els.audio.pause();
      try { els.audio.currentTime = 0; } catch (e) {}
    });
  }

  /* ------------------------------------------------------------------ */
  /*  Background, dim & transparency                                     */
  /* ------------------------------------------------------------------ */

  function blobToArtwork(blob) {
    return new Promise((resolve) => {
      let url = null;
      try {
        url = URL.createObjectURL(blob);
        const img = new Image();
        img.onload = () => {
          try {
            const iw = img.naturalWidth  || img.width;
            const ih = img.naturalHeight || img.height;
            const sMin = Math.min(iw, ih);
            const sx = (iw - sMin) / 2;
            const sy = (ih - sMin) / 2;
            const out = [512, 1024, 1536].map((s) => {
              const c = document.createElement('canvas');
              c.width = c.height = s;
              const g = c.getContext('2d');
              g.drawImage(img, sx, sy, sMin, sMin, 0, 0, s, s);
              return { src: c.toDataURL('image/jpeg', 0.92), sizes: `${s}x${s}`, type: 'image/jpeg' };
            });
            resolve(out);
          } catch (e) { resolve([]); }
          if (url) URL.revokeObjectURL(url);
        };
        img.onerror = () => { if (url) URL.revokeObjectURL(url); resolve([]); };
        img.src = url;
      } catch (e) { if (url) URL.revokeObjectURL(url); resolve([]); }
    });
  }

  async function applyBackground(blob) {
    if (bgUrl) { URL.revokeObjectURL(bgUrl); bgUrl = null; }
    if (!blob) {
      document.documentElement.style.removeProperty('--bg-image');
      els.bgClearBtn.hidden = true;
      bgArtwork = [];
      updateMediaSession();
      return;
    }
    bgUrl = URL.createObjectURL(blob);
    document.documentElement.style.setProperty('--bg-image', `url("${bgUrl}")`);
    els.bgClearBtn.hidden = false;
    bgArtwork = await blobToArtwork(blob);
    updateMediaSession();
  }

  function applyAlpha(transparencyPct) {
    const t = Math.max(0, Math.min(80, Number(transparencyPct) || 0));
    document.documentElement.style.setProperty('--panel-alpha', (1 - t / 100).toFixed(3));
    els.alpha.value = String(t);
    els.alphaVal.textContent = t + '%';
  }

  function applyDim(dimPct) {
    const d = Math.max(0, Math.min(100, Number(dimPct) || 0));
    document.documentElement.style.setProperty('--bg-dim', (d / 100).toFixed(3));
    els.dim.value = String(d);
    els.dimVal.textContent = d + '%';
  }

  /* ------------------------------------------------------------------ */
  /*  Rendering                                                          */
  /* ------------------------------------------------------------------ */

  function render() {
    const scrollTop = els.playlist.scrollTop;
    els.playlist.innerHTML = '';

    if (!tracks.length) {
      const li = document.createElement('li');
      li.className = 'empty';
      li.textContent = 'No tracks yet — open settings to upload audio files.';
      els.playlist.appendChild(li);
    } else {
      const frag = document.createDocumentFragment();
      tracks.forEach((track, i) => {
        const li = document.createElement('li');
        li.className = 'track' + (i === current ? ' active' : '');
        li.dataset.index = String(i);

        const idx = document.createElement('span');
        idx.className = 'idx';
        idx.textContent = i === current ? '▶' : String(i + 1);

        const name = document.createElement('span');
        name.className = 'name';
        name.textContent = track.name;
        name.title = track.name;

        const remove = document.createElement('button');
        remove.className = 'remove';
        remove.type = 'button';
        remove.textContent = '✕';
        remove.title = 'Remove track';
        remove.setAttribute('aria-label', 'Remove track');

        li.append(idx, name, remove);
        frag.appendChild(li);
      });
      els.playlist.appendChild(frag);
    }

    els.playlist.scrollTop = scrollTop;
    updateNowPlaying();
  }

  function renderLoop() {
    els.loopBtn.classList.toggle('on', loopMode !== 'off');
    els.loopBtn.querySelector('.loop-icon').textContent = loopMode === 'one' ? '🔂' : '🔁';
    els.loopBtn.querySelector('.loop-label').textContent = LOOP_LABELS[loopMode];
    els.loopBtn.title = 'Repeat: ' + LOOP_LABELS[loopMode];
  }

  /* ------------------------------------------------------------------ */
  /*  Playlist management                                                */
  /* ------------------------------------------------------------------ */

  function addFiles(fileList) {
    if (!fileList || !fileList.length) return;

    const files = Array.from(fileList).filter(
      f => (f.type && f.type.startsWith('audio/')) || AUDIO_EXT.test(f.name)
    );
    if (!files.length) return;

    const wasEmpty = tracks.length === 0;
    const existing = new Set(tracks.map(t => t.key));
    let added = 0;

    files.forEach(file => {
      const key = `${file.name}|${file.size}|${file.lastModified}`;
      if (existing.has(key)) return;
      existing.add(key);

      const id = ++uid;
      const name = file.name.replace(/\.[^.]+$/, '');
      tracks.push({ id, key, name, url: URL.createObjectURL(file) });
      added++;
      dbPut({ key, name, blob: file, ts: Date.now() + id }).catch(() => {});
    });

    if (!added) return;
    render();
    if (wasEmpty) playTrack(0, false);
  }

  function removeTrack(index) {
    if (index < 0 || index >= tracks.length) return;
    const wasCurrent = index === current;
    dbDelete(tracks[index].key).catch(() => {});
    URL.revokeObjectURL(tracks[index].url);
    tracks.splice(index, 1);

    if (!tracks.length) {
      current = -1;
      els.audio.pause();
      els.audio.removeAttribute('src');
      els.audio.load();
      els.seek.value = 0;
      els.curTime.textContent = '0:00';
      els.durTime.textContent = '0:00';
      setPlayIcon(false);
      render();
      updateMediaSession();
      return;
    }

    if (wasCurrent) {
      els.audio.pause();
      current = -1;
      playTrack(Math.min(index, tracks.length - 1), false);
    } else if (index < current) {
      current--;
    }
    render();
    updateMediaSession();
  }

  function clearAll() {
    if (!tracks.length) return;
    dbClear().catch(() => {});
    tracks.forEach(t => URL.revokeObjectURL(t.url));
    tracks = [];
    current = -1;
    els.audio.pause();
    els.audio.removeAttribute('src');
    els.audio.load();
    els.seek.value = 0;
    els.curTime.textContent = '0:00';
    els.durTime.textContent = '0:00';
    setPlayIcon(false);
    render();
    updateMediaSession();
  }

  /* ------------------------------------------------------------------ */
  /*  Playback                                                           */
  /* ------------------------------------------------------------------ */

  function playTrack(index, autoplay = true) {
    if (index < 0 || index >= tracks.length) return;
    current = index;
    els.audio.src = tracks[index].url;

    if (autoplay) {
      const p = els.audio.play();
      if (p && typeof p.catch === 'function') p.catch(() => {});
    } else {
      els.audio.pause();
      setPlayIcon(false);
    }

    els.seek.value = 0;
    els.curTime.textContent = '0:00';
    els.durTime.textContent = '0:00';
    render();
    updateMediaSession();
    updatePositionState();
  }

  function togglePlay() {
    if (!tracks.length) { openSidebar(); return; }
    if (current === -1) { playTrack(0); return; }
    if (els.audio.paused) {
      const p = els.audio.play();
      if (p && typeof p.catch === 'function') p.catch(() => {});
    } else {
      els.audio.pause();
    }
  }

  function nextTrack(auto = false) {
    if (!tracks.length) return;
    if (current === -1) { playTrack(0); return; }
    if (current < tracks.length - 1) { playTrack(current + 1); return; }
    playTrack(0);
  }

  function prevTrack() {
    if (!tracks.length) return;
    if (current !== -1 && els.audio.currentTime > 3) {
      els.audio.currentTime = 0;
      return;
    }
    if (current > 0) playTrack(current - 1);
    else if (current === 0) playTrack(tracks.length - 1);
    else playTrack(0);
  }

  function seekBy(delta) {
    if (!tracks.length) return;
    const d = els.audio.duration;
    if (!isFinite(d) || d <= 0) return;
    els.audio.currentTime = Math.min(d, Math.max(0, els.audio.currentTime + delta));
  }

  /* ------------------------------------------------------------------ */
  /*  Events                                                             */
  /* ------------------------------------------------------------------ */

  // Sidebar
  els.settingsBtn.addEventListener('click', openSidebar);
  els.closeSidebar.addEventListener('click', closeSidebar);
  els.scrim.addEventListener('click', closeSidebar);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && els.sidebar.classList.contains('open')) closeSidebar();
  });

  // Hide/show everything except the play bar
  els.hideBtn.addEventListener('click', () => {
    setMinimal(!document.body.classList.contains('minimal'));
  });

  // File picker
  els.fileInput.addEventListener('change', e => {
    addFiles(e.target.files);
    e.target.value = '';
  });

  // Background image
  els.bgBtn.addEventListener('click', () => els.bgInput.click());
  els.bgInput.addEventListener('change', async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file || !file.type || !file.type.startsWith('image/')) return;
    await applyBackground(file);
    try { await setPut({ key: 'background', blob: file, type: file.type }); } catch (err) {}
  });
  els.bgClearBtn.addEventListener('click', async () => {
    await applyBackground(null);
    try { await setDelete('background'); } catch (err) {}
  });

  // Dim slider
  let dimSaveTimer = null;
  els.dim.addEventListener('input', () => {
    const v = Number(els.dim.value);
    applyDim(v);
    clearTimeout(dimSaveTimer);
    dimSaveTimer = setTimeout(() => {
      setPut({ key: 'dim', value: v }).catch(() => {});
    }, 250);
  });

  // Transparency slider
  let alphaSaveTimer = null;
  els.alpha.addEventListener('input', () => {
    const v = Number(els.alpha.value);
    applyAlpha(v);
    clearTimeout(alphaSaveTimer);
    alphaSaveTimer = setTimeout(() => {
      setPut({ key: 'alpha', value: v }).catch(() => {});
    }, 250);
  });

  // Drag & drop
  ['dragenter', 'dragover'].forEach(evt => {
    els.drop.addEventListener(evt, e => {
      e.preventDefault();
      els.drop.classList.add('over');
    });
  });
  ['dragleave', 'dragend', 'drop'].forEach(evt => {
    els.drop.addEventListener(evt, e => {
      e.preventDefault();
      els.drop.classList.remove('over');
    });
  });
  els.drop.addEventListener('drop', e => {
    if (e.dataTransfer && e.dataTransfer.files) addFiles(e.dataTransfer.files);
  });
  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('drop', e => e.preventDefault());

  // Playlist interactions
  els.playlist.addEventListener('click', e => {
    const li = e.target.closest('.track');
    if (!li) return;
    const index = Number(li.dataset.index);
    if (e.target.closest('.remove')) { removeTrack(index); return; }
    if (index === current) togglePlay();
    else playTrack(index);
  });

  els.clearBtn.addEventListener('click', clearAll);
  els.playBtn.addEventListener('click', togglePlay);
  els.nextBtn.addEventListener('click', () => nextTrack(false));
  els.prevBtn.addEventListener('click', prevTrack);

  els.loopBtn.addEventListener('click', () => {
    loopMode = loopMode === 'off' ? 'all' : loopMode === 'all' ? 'one' : 'off';
    renderLoop();
  });

  // Audio events
  els.audio.addEventListener('play', () => {
    setPlayIcon(true);
    if ('mediaSession' in navigator) {
      try { navigator.mediaSession.playbackState = 'playing'; } catch (e) {}
    }
  });
  els.audio.addEventListener('pause', () => {
    setPlayIcon(false);
    if ('mediaSession' in navigator && current >= 0) {
      try { navigator.mediaSession.playbackState = 'paused'; } catch (e) {}
    }
  });

  els.audio.addEventListener('loadedmetadata', () => {
    els.durTime.textContent = fmt(els.audio.duration);
    els.seek.value = 0;
    updatePositionState();
  });

  els.audio.addEventListener('timeupdate', () => {
    const d = els.audio.duration;
    if (isFinite(d) && d > 0) {
      els.seek.value = Math.round((els.audio.currentTime / d) * 1000);
      els.durTime.textContent = fmt(d);
    }
    els.curTime.textContent = fmt(els.audio.currentTime);
    updatePositionState();
  });

  els.audio.addEventListener('ended', () => {
    if (!tracks.length) return;
    if (loopMode === 'one') {
      els.audio.currentTime = 0;
      const p = els.audio.play();
      if (p && typeof p.catch === 'function') p.catch(() => {});
      return;
    }
    nextTrack(true);
  });

  els.audio.addEventListener('error', () => {
    if (current >= 0) els.nowSub.textContent = '⚠ Could not play this file';
  });

  els.seek.addEventListener('input', () => {
    const d = els.audio.duration;
    if (!isFinite(d) || d <= 0) return;
    els.audio.currentTime = (Number(els.seek.value) / 1000) * d;
    els.curTime.textContent = fmt(els.audio.currentTime);
    updatePositionState();
  });

  els.volume.addEventListener('input', () => {
    els.audio.volume = Number(els.volume.value);
  });

  document.addEventListener('keydown', e => {
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || tag === 'button' || e.target.isContentEditable) return;
    switch (e.code) {
      case 'Space':      e.preventDefault(); togglePlay(); break;
      case 'ArrowRight': e.preventDefault(); seekBy(5);    break;
      case 'ArrowLeft':  e.preventDefault(); seekBy(-5);   break;
      case 'KeyN':       nextTrack(false); break;
      case 'KeyP':       prevTrack();      break;
      case 'KeyL':
        loopMode = loopMode === 'off' ? 'all' : loopMode === 'all' ? 'one' : 'off';
        renderLoop();
        break;
      case 'KeyH':
        setMinimal(!document.body.classList.contains('minimal'));
        break;
    }
  });

  /* ------------------------------------------------------------------ */
  /*  Init                                                               */
  /* ------------------------------------------------------------------ */

  els.audio.volume = 1;
  renderLoop();
  render();
  setPlayIcon(false);
  setMinimal(false);
  initMediaSession();
  updateMediaSession();
  applyAlpha(Number(els.alpha.value));
  applyDim(Number(els.dim.value));

  (async () => {
    try {
      const recs = await dbAll();
      if (recs.length) {
        recs.sort((a, b) => (a.ts || 0) - (b.ts || 0));
        recs.forEach(r => tracks.push({
          id: ++uid, key: r.key, name: r.name, url: URL.createObjectURL(r.blob)
        }));
        render();
        playTrack(0, false);
      }
    } catch (e) {}

    try {
      const bg = await setGet('background');
      if (bg && bg.blob) await applyBackground(bg.blob);
    } catch (e) {}

    try {
      const a = await setGet('alpha');
      if (a && typeof a.value === 'number') applyAlpha(a.value);
    } catch (e) {}

    try {
      const d = await setGet('dim');
      if (d && typeof d.value === 'number') applyDim(d.value);
    } catch (e) {}
  })();
})();
</script>
</body>
</html>
