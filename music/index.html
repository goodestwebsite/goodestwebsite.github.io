<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Playlist">
<meta name="application-name" content="Playlist">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#0d0f14">
<meta name="color-scheme" content="dark">

<title>Audio Playlist Player</title>
<style>
  :root{
    --bg:#0d0f14;
    --panel:#161922;
    --panel-2:#1d2230;
    --line:#262c3a;
    --line-hi:#3a4258;
    --text:#e9ecf3;
    --muted:#8a93a8;
    --accent:#4f8cff;
    --accent-2:#8b5cff;
    --panel-alpha: 0.90;
    --bg-dim: 0.65;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html{ -webkit-text-size-adjust:100%; }
  html, body{ margin:0; }

  body{
    min-height:100vh;
    min-height:100dvh;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color:var(--text);
    background:var(--bg);
    display:flex;
    justify-content:center;
    padding: calc(28px + env(safe-area-inset-top)) 16px calc(48px + env(safe-area-inset-bottom));
    position:relative;
  }
  body.no-scroll{ overflow:hidden; }

  #bg{
    position:fixed; inset:0; z-index:-1;
    background-color:var(--bg);
    background-image:var(--bg-image, none);
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    pointer-events:none;
  }
  #bg::before{
    content:''; position:absolute; inset:0;
    background:
      radial-gradient(900px 500px at 10% -10%, rgba(79,140,255,.18), transparent 60%),
      radial-gradient(800px 500px at 110% 0%, rgba(139,92,255,.16), transparent 60%);
    pointer-events:none;
  }
  #bg::after{
    content:''; position:absolute; inset:0;
    background:linear-gradient(
      rgb(13 15 20 / calc(var(--bg-dim) * 0.85)),
      rgb(13 15 20 / var(--bg-dim))
    );
    pointer-events:none;
    transition:background .18s ease;
  }

  .app{ width:100%; max-width:800px; position:relative; z-index:1; }

  body.minimal .topbar{ display:none; }
  body.minimal .playlist-panel{ display:none; }

  /* Floating add button */
  #addUrlBtn{
    position:fixed;
    left:20px;
    bottom:calc(24px + env(safe-area-inset-bottom));
    width:54px; height:54px;
    border-radius:50%;
    background:linear-gradient(135deg, var(--accent), var(--accent-2));
    border:0;
    color:#fff;
    font-size:1.9rem;
    font-weight:300;
    line-height:1;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 8px 24px rgba(79,140,255,.45);
    z-index:60;
    transition:.15s;
    touch-action:manipulation;
    padding:0;
    font-family:inherit;
  }
  #addUrlBtn:hover{ filter:brightness(1.08); transform:scale(1.03); }

  /* URL input modal */
  #urlModal{
    position:fixed; inset:0;
    background:rgba(0,0,0,.55);
    display:flex; align-items:center; justify-content:center;
    padding:20px;
    z-index:150;
  }
  #urlModal[hidden]{ display:none; }
  .url-modal-box{
    background:rgba(22,25,34,.98);
    border:1px solid var(--line-hi);
    border-radius:16px;
    width:min(480px, 100%);
    padding:20px;
    box-shadow:0 16px 40px rgba(0,0,0,.6);
    -webkit-backdrop-filter:blur(12px);
    backdrop-filter:blur(12px);
  }
  .url-modal-box h3{
    margin:0 0 14px; font-size:1.05rem; font-weight:600;
  }
  #urlInput{
    width:100%;
    padding:12px 14px;
    background:rgba(0,0,0,.25);
    border:1px solid var(--line);
    border-radius:12px;
    color:var(--text);
    font-family:inherit;
    font-size:.95rem;
    outline:none;
    -webkit-appearance:none;
  }
  #urlInput:focus{ border-color:var(--accent); }
  #urlInput::placeholder{ color:var(--muted); }
  .url-actions{
    display:flex; gap:8px; justify-content:flex-end; margin-top:14px;
  }
  .url-actions .ghost{ padding:8px 16px; }
  .url-actions .ctrl{ padding:8px 20px; }

  .player{
    position:relative;
    background:rgba(22,25,34, var(--panel-alpha));
    -webkit-backdrop-filter:blur(10px);
    backdrop-filter:blur(10px);
    border:1px solid var(--line);
    border-radius:16px;
    padding:16px;
    transition:background-color .18s ease;
  }

  .player-corner{
    position:absolute;
    top:10px; right:10px;
    display:flex; gap:6px;
    z-index:2;
  }
  .icon-btn{
    background:rgba(29,34,48,.85);
    border:1px solid var(--line);
    color:var(--text);
    width:34px; height:34px;
    border-radius:9px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    font-size:.95rem;
    cursor:pointer;
    transition:.15s;
    padding:0;
    font-family:inherit;
  }
  .icon-btn:hover{ background:rgba(40,48,66,.95); border-color:var(--line-hi); }

  .now{ padding-right:84px; }
  .now-title{
    font-weight:600;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    display:flex; align-items:center; gap:6px;
  }
  .yt-badge{
    background:linear-gradient(135deg, #ff0000, #cc0000);
    color:#fff;
    font-size:.55rem;
    font-weight:700;
    padding:2px 5px;
    border-radius:4px;
    letter-spacing:.04em;
    flex:none;
    line-height:1.2;
  }
  .now-sub{ color:var(--muted); font-size:.8rem; margin-top:3px; min-height:1em; }

  .progress-row{ display:flex; align-items:center; gap:10px; margin:14px 0 10px; }
  .time{
    font-size:.75rem; color:var(--muted);
    font-variant-numeric:tabular-nums; min-width:38px; text-align:center;
  }

  input[type="range"]{
    -webkit-appearance:none; appearance:none;
    height:4px; border-radius:999px;
    background:var(--line); outline:none; cursor:pointer;
    touch-action:pan-y;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:16px; height:16px; border-radius:50%; border:0;
    background:linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow:0 0 0 3px rgba(79,140,255,.16);
  }
  input[type="range"]::-moz-range-thumb{
    width:16px; height:16px; border:0; border-radius:50%;
    background:linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow:0 0 0 3px rgba(79,140,255,.16);
  }
  #seek{ flex:1; }

  .controls{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .ctrl{
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:12px;
    padding:10px 13px;
    font-size:1rem;
    font-family:inherit;
    cursor:pointer;
    display:inline-flex; align-items:center; gap:6px;
    transition:.15s; touch-action:manipulation;
  }
  .ctrl:hover{ background:#232a3a; border-color:var(--line-hi); }

  .ctrl.play{
    width:50px; height:50px; border-radius:50%;
    justify-content:center; font-size:1.05rem;
    background:linear-gradient(135deg, var(--accent), var(--accent-2));
    border:0; color:#fff;
    box-shadow:0 6px 18px rgba(79,140,255,.35);
  }
  .ctrl.play:hover{ filter:brightness(1.08); }

  .ctrl.loop .loop-label{
    font-size:.75rem; color:var(--muted);
    font-variant-numeric:tabular-nums;
  }
  .ctrl.loop.on{
    border-color:var(--accent);
    background:rgba(79,140,255,.12);
    color:var(--accent);
  }
  .ctrl.loop.on .loop-label{ color:var(--accent); }

  .vol{ margin-left:auto; display:flex; align-items:center; gap:8px; color:var(--muted); }
  .vol input{ width:90px; }

  @media (max-width:520px){
    .vol{ margin-left:0; width:100%; }
    .vol input{ flex:1; width:auto; }
    #addUrlBtn{ width:48px; height:48px; font-size:1.7rem; left:14px; }
  }

  .panel{
    margin-top:16px;
    background:rgba(22,25,34, var(--panel-alpha));
    -webkit-backdrop-filter:blur(10px);
    backdrop-filter:blur(10px);
    border:1px solid var(--line);
    border-radius:16px;
    overflow:hidden;
    transition:background-color .18s ease;
  }
  .panel-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 16px;
    border-bottom:1px solid var(--line);
    gap:8px;
  }
  .panel-head h2{
    margin:0; font-size:1rem; font-weight:600;
    display:flex; align-items:center; gap:8px;
  }
  .panel-actions{ display:flex; gap:6px; flex:none; }
  .count{
    background:var(--panel-2); color:var(--muted);
    font-size:.72rem; padding:2px 8px; border-radius:999px;
    font-variant-numeric:tabular-nums;
  }
  .ghost{
    background:transparent; border:1px solid var(--line);
    color:var(--muted); padding:7px 11px; border-radius:10px;
    cursor:pointer; font-size:.8rem; font-family:inherit; transition:.15s;
    white-space:nowrap;
  }
  .ghost:hover{ color:var(--text); border-color:var(--line-hi); }
  .ghost:disabled{ opacity:.4; cursor:not-allowed; }
  .ghost.active{
    color:var(--accent);
    border-color:var(--accent);
    background:rgba(79,140,255,.12);
  }

  .playlist{
    list-style:none; margin:0; padding:6px;
    max-height:340px; overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }
  .playlist::-webkit-scrollbar{ width:10px; }
  .playlist::-webkit-scrollbar-thumb{
    background:var(--line); border-radius:999px; border:3px solid transparent;
    background-clip:padding-box;
  }

  .track{
    display:flex; align-items:center; gap:8px;
    padding:10px 12px; border-radius:10px;
    cursor:pointer; transition:background .15s;
  }
  .track:hover{ background:rgba(255,255,255,.04); }
  .track.active{
    background:linear-gradient(90deg, rgba(79,140,255,.22), rgba(139,92,255,.12));
  }
  body.editing .track{ cursor:default; }
  .track .idx{
    width:22px; text-align:center; color:var(--muted);
    font-size:.8rem; font-variant-numeric:tabular-nums; flex:none;
  }
  .track.active .idx{ color:var(--accent); }
  .track .name{
    flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    font-size:.94rem;
  }
  .track.active .name{ font-weight:600; }
  .track .yt-tag{
    background:linear-gradient(135deg, #ff0000, #cc0000);
    color:#fff;
    font-size:.55rem;
    font-weight:700;
    padding:2px 5px;
    border-radius:4px;
    letter-spacing:.04em;
    flex:none;
    line-height:1.2;
  }

  .track .note{
    background:transparent;
    border:1px solid var(--line);
    color:var(--muted);
    cursor:pointer;
    font-size:.72rem;
    font-weight:700;
    padding:0;
    width:22px; height:22px;
    border-radius:6px;
    opacity:.6;
    flex:none;
    transition:.15s;
    font-family:inherit;
    line-height:1;
    display:inline-flex;
    align-items:center;
    justify-content:center;
  }
  .track .note:hover{ background:rgba(255,255,255,.06); opacity:1; color:var(--text); border-color:var(--line-hi); }
  .track .note.has{ opacity:1; color:var(--accent); border-color:var(--accent); }

  .track .move{
    background:transparent;
    border:1px solid var(--line);
    color:var(--muted);
    cursor:pointer;
    width:26px; height:26px;
    border-radius:6px;
    font-size:.85rem;
    font-family:inherit;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:0;
    transition:.15s;
    flex:none;
    line-height:1;
    user-select:none;
    -webkit-user-select:none;
    touch-action:manipulation;
  }
  .track .move:hover:not(:disabled){
    background:rgba(255,255,255,.06);
    color:var(--text);
    border-color:var(--line-hi);
  }
  .track .move:disabled{ opacity:.25; cursor:not-allowed; }

  .track .remove{
    background:transparent; border:0; color:var(--muted);
    cursor:pointer; font-size:.95rem; padding:6px 9px;
    border-radius:8px; opacity:.55; flex:none;
    transition:.15s; font-family:inherit; line-height:1;
  }
  .track .remove:hover{
    color:#ff6b6b; background:rgba(255,107,107,.14); opacity:1;
  }
  .empty{
    padding:24px 16px; text-align:center; color:var(--muted); font-size:.9rem;
  }

  #scrim{
    position:fixed; inset:0; background:rgba(0,0,0,.55);
    opacity:0; pointer-events:none;
    transition:opacity .25s ease; z-index:40;
  }
  #scrim.show{ opacity:1; pointer-events:auto; }

  #sidebar{
    position:fixed; top:0; right:0;
    height:100vh; height:100dvh;
    width:min(420px, 92vw);
    background:rgba(16,18,26,.96);
    -webkit-backdrop-filter:blur(14px);
    backdrop-filter:blur(14px);
    border-left:1px solid var(--line);
    z-index:50;
    transform:translateX(100%);
    transition:transform .28s cubic-bezier(.2,.8,.2,1);
    display:flex; flex-direction:column;
    box-shadow:-16px 0 40px rgba(0,0,0,.5);
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
  }
  #sidebar.open{ transform:translateX(0); }

  .sidebar-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px; border-bottom:1px solid var(--line); flex:none;
  }
  .sidebar-head h2{ margin:0; font-size:1rem; font-weight:600; }

  .sidebar-body{
    padding:16px; overflow-y:auto; -webkit-overflow-scrolling:touch;
    flex:1; display:flex; flex-direction:column; gap:10px;
  }
  .sidebar-body h3{
    margin:14px 0 2px; font-size:.78rem;
    text-transform:uppercase; letter-spacing:.08em;
    color:var(--muted); font-weight:600;
  }
  .sidebar-body h3:first-child{ margin-top:0; }

  .row-between{ display:flex; align-items:center; justify-content:space-between; gap:8px; }

  .setting-row{
    display:flex; align-items:center; gap:10px;
    padding:6px 0; font-size:.88rem;
  }
  .setting-row > span:first-child{ flex:1; }
  .setting-row input[type="range"]{ flex:1.2; }
  #alphaVal, #dimVal{
    min-width:40px; text-align:right; color:var(--muted);
    font-variant-numeric:tabular-nums; font-size:.8rem;
  }

  .drop{
    display:flex; flex-direction:column; align-items:center; gap:6px;
    padding:22px 16px;
    border:2px dashed var(--line); border-radius:14px;
    background:rgba(255,255,255,.03);
    cursor:pointer; text-align:center;
    transition:border-color .18s, background .18s, transform .18s;
    user-select:none; -webkit-user-select:none;
  }
  .drop:hover, .drop.over{
    border-color:var(--accent); background:rgba(79,140,255,.10);
  }
  .drop.over{ transform:scale(1.01); }
  .drop-icon{ font-size:1.5rem; line-height:1; }

  #noteScrim{
    position:fixed; inset:0; background:rgba(0,0,0,.55);
    opacity:0; pointer-events:none;
    transition:opacity .25s ease; z-index:40;
  }
  #noteScrim.show{ opacity:1; pointer-events:auto; }

  #noteSidebar{
    position:fixed; top:0; left:0;
    height:100vh; height:100dvh;
    width:min(420px, 92vw);
    background:rgba(16,18,26,.96);
    -webkit-backdrop-filter:blur(14px);
    backdrop-filter:blur(14px);
    border-right:1px solid var(--line);
    z-index:50;
    transform:translateX(-100%);
    transition:transform .28s cubic-bezier(.2,.8,.2,1);
    display:flex; flex-direction:column;
    box-shadow:16px 0 40px rgba(0,0,0,.5);
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
  }
  #noteSidebar.open{ transform:translateX(0); }

  .note-sidebar-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px; border-bottom:1px solid var(--line); flex:none;
    gap:8px;
  }
  .note-sidebar-head h2{
    margin:0; font-size:1rem; font-weight:600;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    flex:1;
  }
  .note-head-actions{
    display:flex; gap:6px; flex:none; align-items:center;
  }
  .note-edit-btn{ padding:6px 12px; font-size:.8rem; }

  .note-sidebar-body{
    flex:1; display:flex; flex-direction:column;
    overflow:hidden; min-height:0;
  }

  .note-preview{
    flex:1;
    margin:16px;
    padding:14px;
    background:rgba(0,0,0,.2);
    border:1px solid var(--line);
    border-radius:12px;
    color:var(--text);
    font-size:.9rem;
    line-height:1.5;
    white-space:pre-wrap;
    word-wrap:break-word;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    min-height:0;
  }
  .note-preview.empty{ color:var(--muted); font-style:italic; }
  .note-preview[hidden], .note-editor[hidden]{ display:none; }

  .note-editor{
    flex:1;
    margin:16px;
    padding:12px;
    background:rgba(0,0,0,.25);
    border:1px solid var(--line);
    border-radius:12px;
    color:var(--text);
    font-family:inherit;
    font-size:.9rem;
    line-height:1.5;
    resize:none;
    outline:none;
    -webkit-appearance:none;
    min-height:0;
  }
  .note-editor:focus{ border-color:var(--accent); }

  .note-edit-actions{
    display:flex; gap:8px; justify-content:flex-end;
    padding:12px 16px; border-top:1px solid var(--line);
    flex:none;
  }
  .note-edit-actions[hidden]{ display:none; }

  #toast{
    position:fixed;
    left:50%; bottom:calc(24px + env(safe-area-inset-bottom));
    transform:translateX(-50%) translateY(20px);
    background:rgba(22,25,34,.98);
    border:1px solid var(--line-hi);
    color:var(--text);
    padding:10px 16px;
    border-radius:12px;
    font-size:.85rem;
    box-shadow:0 8px 24px rgba(0,0,0,.55);
    opacity:0;
    pointer-events:none;
    transition:opacity .2s, transform .2s;
    z-index:200;
    max-width:90vw;
    text-align:center;
  }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  #ytHost {
    position: fixed;
    left: 50%;
    bottom: 90px;
    transform: translateX(-50%);
    width: 300px;
    height: 52px;
    border-radius: 10px;
    overflow: hidden;
    z-index: 9999;
    box-shadow: 0 4px 16px rgba(0,0,0,.4);
  }
</style>
</head>
<body>

<div id="bg"></div>

<!-- Hidden YouTube player host -->
<div id="ytHost" style="position:fixed;width:1px;height:1px;left:-9999px;top:-9999px;overflow:hidden;"></div>

<div class="app">
  <section class="player">
    <div class="player-corner">
      <button id="settingsBtn" class="icon-btn" type="button" aria-label="Settings" title="Settings">⚙</button>
      <button id="hideBtn" class="icon-btn" type="button" aria-label="Hide playlist" title="Hide playlist">▴</button>
    </div>

    <div class="now">
      <div id="nowTitle" class="now-title">No track selected</div>
      <div id="nowSub" class="now-sub"></div>
    </div>

    <div class="progress-row">
      <span id="curTime" class="time">0:00</span>
      <input id="seek" type="range" min="0" max="1000" step="1" value="0" aria-label="Seek">
      <span id="durTime" class="time">0:00</span>
    </div>

    <div class="controls">
      <button id="prevBtn" class="ctrl" type="button" title="Previous" aria-label="Previous">⏮</button>
      <button id="playBtn" class="ctrl play" type="button" title="Play / Pause" aria-label="Play">▶</button>
      <button id="nextBtn" class="ctrl" type="button" title="Next" aria-label="Next">⏭</button>
      <button id="loopBtn" class="ctrl loop" type="button" title="Repeat: Off" aria-label="Repeat mode">
        <span class="loop-icon">🔁</span><span class="loop-label">Off</span>
      </button>
      <div class="vol">
        <span class="vol-icon">🔊</span>
        <input id="volume" type="range" min="0" max="1" step="0.01" value="1" aria-label="Volume">
      </div>
    </div>
  </section>

  <section class="panel playlist-panel">
    <div class="panel-head">
      <h2>Playlist <span id="count" class="count">0</span></h2>
      <div class="panel-actions">
        <button id="editBtn" class="ghost" type="button">Edit</button>
        <button id="clearBtn" class="ghost" type="button">Clear all</button>
      </div>
    </div>
    <ul id="playlist" class="playlist"></ul>
  </section>
</div>

<!-- Floating + button -->
<button id="addUrlBtn" type="button" aria-label="Add YouTube link" title="Add YouTube link">＋</button>

<!-- URL modal -->
<div id="urlModal" hidden>
  <div class="url-modal-box">
    <h3>Add YouTube / YouTube Music link</h3>
    <input id="urlInput" type="url" placeholder="https://music.youtube.com/watch?v=…" autocomplete="off" />
    <div class="url-actions">
      <button id="urlCancel" class="ghost" type="button">Cancel</button>
      <button id="urlAdd" class="ctrl" type="button">Add</button>
    </div>
  </div>
</div>

  /* ---- IndexedDB ---- */
  const DB_NAME = 'audio-playlist', STORE = 'tracks', SETTINGS = 'settings';
  let dbPromise = null;
  function db(){
    if (!dbPromise) dbPromise = new Promise((res, rej) => {
      const r = indexedDB.open(DB_NAME, 2);
      r.onupgradeneeded = () => {
        const d = r.result;
        if (!d.objectStoreNames.contains(STORE))    d.createObjectStore(STORE, { keyPath:'key' });
        if (!d.objectStoreNames.contains(SETTINGS)) d.createObjectStore(SETTINGS, { keyPath:'key' });
      };
      r.onsuccess = () => res(r.result);
      r.onerror   = () => rej(r.error);
    });
    return dbPromise;
  }
  function dbPut(rec){ return db().then(d => new Promise((res, rej) => {
    const tx = d.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).put(rec);
    tx.oncomplete = res; tx.onerror = () => rej(tx.error);
  })); }
  function dbDelete(key){ return db().then(d => new Promise((res, rej) => {
    const tx = d.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).delete(key);
    tx.oncomplete = res; tx.onerror = () => rej(tx.error);
  })); }
  function dbAll(){ return db().then(d => new Promise((res, rej) => {
    const req = d.transaction(STORE, 'readonly').objectStore(STORE).getAll();
    req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error);
  })); }
  function dbClear(){ return db().then(d => new Promise((res, rej) => {
    const tx = d.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).clear();
    tx.oncomplete = res; tx.onerror = () => rej(tx.error);
  })); }
  function setGet(key){ return db().then(d => new Promise((res, rej) => {
    const req = d.transaction(SETTINGS, 'readonly').objectStore(SETTINGS).get(key);
    req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error);
  })); }
  function setPut(rec){ return db().then(d => new Promise((res, rej) => {
    const tx = d.transaction(SETTINGS, 'readwrite');
    tx.objectStore(SETTINGS).put(rec);
    tx.oncomplete = res; tx.onerror = () => rej(tx.error);
  })); }
  function setDelete(key){ return db().then(d => new Promise((res, rej) => {
    const tx = d.transaction(SETTINGS, 'readwrite');
    tx.objectStore(SETTINGS).delete(key);
    tx.oncomplete = res; tx.onerror = () => rej(tx.error);

  function setAll(){ return db().then(d => new Promise((res, rej) => {
    const req = d.transaction(SETTINGS, 'readonly').objectStore(SETTINGS).getAll();
    req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error);
  })); }

  const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                 (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (IS_IOS) document.documentElement.classList.add('ios');

  const IS_STANDALONE =
    window.navigator.standalone === true ||
    (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  if (IS_STANDALONE) document.body.classList.add('standalone');

  let tracks = [];
  let current = -1;
  let loopMode = 'off';
  let uid = 0;
  let editing = false;

  let bgUrl = null;
  let bgArtwork = [];
  let lockArtwork = [];
  let fallbackArtwork = [];
  let customIconDataUrl = null;
  let manifestUrl = null;

  let notesMap = new Map();
  let editingIndex = -1;
  let gapTimer = null;

  // YouTube state
  let ytPlayer = null;
  let ytReady = false;
  let ytPollTimer = null;
  let currentIsYT = false;

  /* ------------------------------------------------------------------ */
  /*  Toast                                                              */
  /* ------------------------------------------------------------------ */
  let toastTimer = null;
  function toast(msg, ms) {
    els.toast.textContent = msg;
    els.toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => els.toast.classList.remove('show'), ms || 2200);
  }

  /* ------------------------------------------------------------------ */
  /*  PWA icons + manifest                                               */
  /* ------------------------------------------------------------------ */
  function generateIcon(size) {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const g = c.getContext('2d');
    const grad = g.createLinearGradient(0, 0, size, size);
    grad.addColorStop(0, '#4f8cff');
    grad.addColorStop(1, '#8b5cff');
    g.fillStyle = grad;
    g.fillRect(0, 0, size, size);
    g.fillStyle = 'rgba(255,255,255,.96)';
    g.font = `bold ${Math.round(size * 0.58)}px system-ui, -apple-system, "Segoe UI", sans-serif`;
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillText('♪', size / 2, size / 2 + size * 0.06);
    return c.toDataURL('image/png');
  }
  function iconDataUrlFor(size) {
    return customIconDataUrl || generateIcon(size);
  }
  function installIconLinks() {
    document.querySelectorAll('link[rel="apple-touch-icon"], link[rel="icon"]').forEach(l => l.remove());
    [180, 167, 152, 120].forEach(size => {
      const link = document.createElement('link');
      link.rel = 'apple-touch-icon';
      link.setAttribute('sizes', `${size}x${size}`);
      link.href = customIconDataUrl || generateIcon(size);
      document.head.appendChild(link);
    });
    const fav = document.createElement('link');
    fav.rel = 'icon';
    fav.type = 'image/png';
    fav.href = iconDataUrlFor(64);
    document.head.appendChild(fav);
  }
  function installManifest() {
    if (manifestUrl) { try { URL.revokeObjectURL(manifestUrl); } catch (e) {} manifestUrl = null; }
    const old = document.querySelector('link[rel="manifest"]');
    if (old) old.remove();
    try {
      const manifest = {
        name: 'Audio Playlist',
        short_name: 'Playlist',
        description: 'Local audio playlist player.',
        start_url: '.',
        scope: './',
        display: 'standalone',
        orientation: 'portrait',
        background_color: '#0d0f14',
        theme_color: '#0d0f14',
        icons: [
          { src: iconDataUrlFor(192), sizes: '192x192', type: 'image/png', purpose: 'any' },
          { src: iconDataUrlFor(512), sizes: '512x512', type: 'image/png', purpose: 'any' },
          { src: iconDataUrlFor(512), sizes: '512x512', type: 'image/png', purpose: 'maskable' }
        ]
      };
      const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
      manifestUrl = URL.createObjectURL(blob);
      const link = document.createElement('link');
      link.rel = 'manifest';
      link.href = manifestUrl;
      document.head.appendChild(link);
    } catch (e) {}
  }
  function rebuildIconAssets() { installIconLinks(); installManifest(); }

  function makeFallbackArtwork() {
    try {
      fallbackArtwork = [512, 1024, 1536].map((s) => {
        const c = document.createElement('canvas');
        c.width = c.height = s;
        const g = c.getContext('2d');
        const grad = g.createLinearGradient(0, 0, s, s);
        grad.addColorStop(0, '#4f8cff');
        grad.addColorStop(1, '#8b5cff');
        g.fillStyle = grad;
        g.fillRect(0, 0, s, s);
        g.fillStyle = 'rgba(255,255,255,.92)';
        g.font = `${Math.round(s * 0.51)}px system-ui, -apple-system, sans-serif`;
        g.textAlign = 'center';
        g.textBaseline = 'middle';
        g.fillText('♪', s / 2, s / 2 + s * 0.04);
        return { src: c.toDataURL('image/png'), sizes: `${s}x${s}`, type: 'image/png' };
      });
    } catch (e) { fallbackArtwork = []; }
  }
  makeFallbackArtwork();

  /* ------------------------------------------------------------------ */
  /*  Helpers                                                            */
  /* ------------------------------------------------------------------ */
  function fmt(seconds) {
    if (!isFinite(seconds) || seconds < 0) return '0:00';
    const m = Math.floor(seconds / 60);
    const s = Math.floor(seconds % 60);
    return m + ':' + String(s).padStart(2, '0');
  }
  function setPlayIcon(isPlaying) {
    els.playBtn.textContent = isPlaying ? '⏸' : '▶';
    els.playBtn.setAttribute('aria-label', isPlaying ? 'Pause' : 'Play');
  }
  function updateNowPlaying() {
    const titleEl = els.nowTitle;
    titleEl.textContent = '';

    if (current >= 0 && tracks[current]) {
      const t = tracks[current];
      const titleSpan = document.createElement('span');
      titleSpan.textContent = t.name;
      titleSpan.style.overflow = 'hidden';
      titleSpan.style.textOverflow = 'ellipsis';
      titleSpan.style.whiteSpace = 'nowrap';
      titleEl.appendChild(titleSpan);
      if (t.type === 'youtube') {
        const badge = document.createElement('span');
        badge.className = 'yt-badge';
        badge.textContent = 'YT';
        titleEl.appendChild(badge);
      }
      els.nowSub.textContent = `Track ${current + 1} of ${tracks.length}`;
      document.title = t.name + ' — Audio Playlist';
    } else {
      titleEl.textContent = 'No track selected';
      els.nowSub.textContent = '';
      document.title = 'Audio Playlist Player';
    }
    els.count.textContent = String(tracks.length);
  }

  /* ------------------------------------------------------------------ */
  /*  Reorder / edit mode                                                */
  /* ------------------------------------------------------------------ */
  function setEditMode(on) {
    editing = on;
    els.editBtn.textContent = on ? 'Done' : 'Edit';
    els.editBtn.classList.toggle('active', on);
    document.body.classList.toggle('editing', on);
    render();
  }

  function saveOrder() {
    const keys = tracks.map(t => t.key);
    setPut({ key: 'order', keys }).catch(() => {});
  }

  function moveTrack(from, dir) {
    const to = from + dir;
    if (to < 0 || to >= tracks.length) return;
    [tracks[from], tracks[to]] = [tracks[to], tracks[from]];
    if (current === from) current = to;
    else if (current === to) current = from;
    saveOrder();
    render();
  }

  /* ------------------------------------------------------------------ */
  /*  Settings sidebar (right) + minimize                                */
  /* ------------------------------------------------------------------ */
  function openSidebar() {
    if (els.noteSidebar.classList.contains('open')) closeNoteSidebar();
    els.sidebar.classList.add('open');
    els.sidebar.setAttribute('aria-hidden', 'false');
    els.scrim.classList.add('show');
    document.body.classList.add('no-scroll');
  }
  function closeSidebar() {
    els.sidebar.classList.remove('open');
    els.sidebar.setAttribute('aria-hidden', 'true');
    els.scrim.classList.remove('show');
    if (!els.noteSidebar.classList.contains('open')) {
      document.body.classList.remove('no-scroll');

  }
  function setMinimal(on) {
    document.body.classList.toggle('minimal', on);
    els.hideBtn.textContent = on ? '▾' : '▴';

    els.hideBtn.setAttribute('aria-label', label);
    els.hideBtn.title = label;
  }

  /* ------------------------------------------------------------------ */
  /*  Notes sidebar (LEFT)                                               */
  /* ------------------------------------------------------------------ */
  function openNoteSidebar(index) {
    if (index < 0 || index >= tracks.length) return;
    if (els.sidebar.classList.contains('open')) {
      els.sidebar.classList.remove('open');
      els.sidebar.setAttribute('aria-hidden', 'true');
      els.scrim.classList.remove('show');
    }
    editingIndex = index;
    const t = tracks[index];
    els.noteTitle.textContent = t.name;
    els.noteText.value = notesMap.get(t.key) || '';
    updateNotePreview();
    setNoteEditMode(false);
    els.noteSidebar.classList.add('open');
    els.noteSidebar.setAttribute('aria-hidden', 'false');
    els.noteScrim.classList.add('show');
    document.body.classList.add('no-scroll');
  }

  function closeNoteSidebar() {
    els.noteSidebar.classList.remove('open');
    els.noteSidebar.setAttribute('aria-hidden', 'true');
    els.noteScrim.classList.remove('show');
    if (!els.sidebar.classList.contains('open')) {
      document.body.classList.remove('no-scroll');
    }
    editingIndex = -1;
    setNoteEditMode(false);
  }

  function setNoteEditMode(on) {
    els.notePreview.hidden = on;
    els.noteText.hidden = !on;
    els.noteEditBtn.hidden = on;
    els.noteEditActions.hidden = !on;
    if (on) setTimeout(() => { try { els.noteText.focus(); } catch (e) {} }, 30);
  }

  function updateNotePreview() {
    if (editingIndex < 0 || editingIndex >= tracks.length) return;
    const t = tracks[editingIndex];
    const note = notesMap.get(t.key) || '';
    if (note.trim()) {
      els.notePreview.textContent = note;
      els.notePreview.classList.remove('empty');
    } else {
      els.notePreview.textContent = 'No note yet. Tap Edit to add one.';
      els.notePreview.classList.add('empty');
    }
  }

  async function saveNote() {
    if (editingIndex < 0) { closeNoteSidebar(); return; }
    const t = tracks[editingIndex];
    const text = els.noteText.value;
    if (text.trim()) {
      notesMap.set(t.key, text);
      try { await setPut({ key: 'note:' + t.key, text }); } catch (e) {}
    } else {
      notesMap.delete(t.key);
      try { await setDelete('note:' + t.key); } catch (e) {}
    }
    updateNotePreview();
    setNoteEditMode(false);
    render();
  }

  async function deleteNote() {
    if (editingIndex < 0) { closeNoteSidebar(); return; }
    const t = tracks[editingIndex];
    notesMap.delete(t.key);
    try { await setDelete('note:' + t.key); } catch (e) {}
    els.noteText.value = '';
    updateNotePreview();
    setNoteEditMode(false);
    render();
  }

  /* ------------------------------------------------------------------ */
  /*  Media Session                                                      */
  /* ------------------------------------------------------------------ */
  function pickArtwork() {
    if (lockArtwork && lockArtwork.length) return lockArtwork;
    if (bgArtwork && bgArtwork.length)     return bgArtwork;
    return fallbackArtwork;
  }
  function updateMediaSession() {
    if (!('mediaSession' in navigator)) return;
    const ms = navigator.mediaSession;
    if (current < 0 || !tracks[current]) {
      try { ms.metadata = null; } catch (e) {}
      try { ms.playbackState = 'none'; } catch (e) {}
      return;
    }
    const t = tracks[current];
    try {
      if (typeof MediaMetadata !== 'undefined') {
        ms.metadata = new MediaMetadata({
          title: t.name,
          artist: t.type === 'youtube' ? 'YouTube Music' : 'Audio Playlist',
          album: tracks.length + ' track' + (tracks.length === 1 ? '' : 's'),
          artwork: pickArtwork()
        });
      }
    } catch (e) {}
    try { ms.playbackState = isPlaying() ? 'playing' : 'paused'; } catch (e) {}
  }
  function updatePositionState() {
    if (!('mediaSession' in navigator)) return;
    if (typeof navigator.mediaSession.setPositionState !== 'function') return;
    const d = getDuration();
    if (!isFinite(d) || d <= 0) return;
    try {
      navigator.mediaSession.setPositionState({
        duration: d,
        playbackRate: 1,
        position: Math.min(d, Math.max(0, getCurrentTime() || 0))
      });
    } catch (e) {}
  }
  function initMediaSession() {
    if (!('mediaSession' in navigator)) return;
    const ms = navigator.mediaSession;
    const safe = (action, fn) => { try { ms.setActionHandler(action, fn); } catch (e) {} };
    safe('play', () => {
      if (current === -1) { playTrack(0); return; }
      if (currentIsYT) { if (ytPlayer) ytPlayer.playVideo(); }
      else { const p = els.audio.play(); if (p && p.catch) p.catch(() => {}); }
    });
    safe('pause', () => {
      if (currentIsYT) { if (ytPlayer) ytPlayer.pauseVideo(); }
      else els.audio.pause();
    });
    safe('previoustrack', () => prevTrack());
    safe('nexttrack', () => nextTrack(false));
    safe('seekbackward', (d) => seekBy(-((d && d.seekOffset) || 10)));
    safe('seekforward',  (d) => seekBy(  (d && d.seekOffset) || 10));
    safe('seekto', (d) => {
      if (!d || typeof d.seekTime !== 'number') return;
      if (currentIsYT) { if (ytPlayer) ytPlayer.seekTo(d.seekTime, true); }
      else { try { els.audio.currentTime = d.seekTime; } catch (e) {} }
      updatePositionState();
    });
    safe('stop', () => {
      if (currentIsYT) { if (ytPlayer) { ytPlayer.pauseVideo(); ytPlayer.seekTo(0, true); } }
      else { els.audio.pause(); try { els.audio.currentTime = 0; } catch (e) {} }
    });
  }

  /* ------------------------------------------------------------------ */
  /*  Image helpers                                                      */
  /* ------------------------------------------------------------------ */
  function blobToArtwork(blob) {
    return new Promise((resolve) => {
      let url = null;
      try {
        url = URL.createObjectURL(blob);
        const img = new Image();
        img.onload = () => {
          try {
            const iw = img.naturalWidth  || img.width;
            const ih = img.naturalHeight || img.height;
            const sMin = Math.min(iw, ih);
            const sx = (iw - sMin) / 2;
            const sy = (ih - sMin) / 2;
            const out = [512, 1024, 1536].map((s) => {
              const c = document.createElement('canvas');
              c.width = c.height = s;
              const g = c.getContext('2d');
              g.drawImage(img, sx, sy, sMin, sMin, 0, 0, s, s);
              return { src: c.toDataURL('image/jpeg', 0.92), sizes: `${s}x${s}`, type: 'image/jpeg' };
            });
            resolve(out);
          } catch (e) { resolve([]); }
          if (url) URL.revokeObjectURL(url);
        };
        img.onerror = () => { if (url) URL.revokeObjectURL(url); resolve([]); };
        img.src = url;
      } catch (e) { if (url) URL.revokeObjectURL(url); resolve([]); }
    });
  }
  function blobToIconDataUrl(blob, size) {
    return new Promise((resolve) => {
      let url = null;
      try {
        url = URL.createObjectURL(blob);
        const img = new Image();
        img.onload = () => {
          try {
            const iw = img.naturalWidth  || img.width;
            const ih = img.naturalHeight || img.height;
            const sMin = Math.min(iw, ih);
            const sx = (iw - sMin) / 2;
            const sy = (ih - sMin) / 2;
            const c = document.createElement('canvas');
            c.width = c.height = size;
            const g = c.getContext('2d');
            g.fillStyle = '#0d0f14';
            g.fillRect(0, 0, size, size);
            g.drawImage(img, sx, sy, sMin, sMin, 0, 0, size, size);
            resolve(c.toDataURL('image/png'));
          } catch (e) { resolve(null); }
          if (url) URL.revokeObjectURL(url);
        };
        img.onerror = () => { if (url) URL.revokeObjectURL(url); resolve(null); };
        img.src = url;
      } catch (e) { if (url) URL.revokeObjectURL(url); resolve(null); }
    });
  }
  function blobToDataUrl(blob) {
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(r.result);
      r.onerror = () => rej(r.error);
      r.readAsDataURL(blob);
    });
  }
  function dataUrlToBlob(dataUrl) {
    const comma = dataUrl.indexOf(',');
    const meta = dataUrl.slice(0, comma);
    const b64 = dataUrl.slice(comma + 1);
    const m = /data:([^;]+)/.exec(meta);
    const mime = m ? m[1] : 'application/octet-stream';
    const bin = atob(b64);
    const len = bin.length;
    const bytes = new Uint8Array(len);
    for (let i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);
    return new Blob([bytes], { type: mime });
  }

  /* ------------------------------------------------------------------ */
  /*  Background / lock screen / icon state                              */
  /* ------------------------------------------------------------------ */
  async function applyBackground(blob) {
    if (bgUrl) { URL.revokeObjectURL(bgUrl); bgUrl = null; }
    if (!blob) {
      document.documentElement.style.removeProperty('--bg-image');
      els.bgClearBtn.hidden = true;
      bgArtwork = [];
      updateMediaSession();
      return;
    }
    bgUrl = URL.createObjectURL(blob);
    document.documentElement.style.setProperty('--bg-image', `url("${bgUrl}")`);
    els.bgClearBtn.hidden = false;
    bgArtwork = await blobToArtwork(blob);
    updateMediaSession();
  }
  async function applyLockImage(blob) {
    if (!blob) {
      lockArtwork = [];
      els.lockClearBtn.hidden = true;
      updateMediaSession();
      return;
    }
    lockArtwork = await blobToArtwork(blob);
    els.lockClearBtn.hidden = false;
    updateMediaSession();
  }
  async function applyIcon(blob) {
    if (!blob) {
      customIconDataUrl = null;
      els.iconClearBtn.hidden = true;
      rebuildIconAssets();
      return;
    }
    const dataUrl = await blobToIconDataUrl(blob, 512);
    if (!dataUrl) return;
    customIconDataUrl = dataUrl;
    els.iconClearBtn.hidden = false;
    rebuildIconAssets();
  }
  function applyAlpha(transparencyPct) {
    const t = Math.max(0, Math.min(80, Number(transparencyPct) || 0));
    document.documentElement.style.setProperty('--panel-alpha', (1 - t / 100).toFixed(3));
    els.alpha.value = String(t);
    els.alphaVal.textContent = t + '%';
  }
  function applyDim(dimPct) {
    const d = Math.max(0, Math.min(100, Number(dimPct) || 0));
    document.documentElement.style.setProperty('--bg-dim', (d / 100).toFixed(3));
    els.dim.value = String(d);
    els.dimVal.textContent = d + '%';
  }

  /* ------------------------------------------------------------------ */
  /*  YouTube IFrame integration                                         */
  /* ------------------------------------------------------------------ */
async function fetchYouTubeTitle(videoId) {
  try {
    const res = await fetch(
      `https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${videoId}&format=json`
    );
    if (!res.ok) return null;
    const data = await res.json();
    return data.title || null;
  } catch (e) {
    return null;
  }
}
  function parseYouTubeId(url) {
    if (!url) return null;
    const patterns = [
      /(?:youtube\.com|music\.youtube\.com)\/watch\?.*v=([A-Za-z0-9_-]{11})/,
      /youtu\.be\/([A-Za-z0-9_-]{11})/,
      /youtube\.com\/shorts\/([A-Za-z0-9_-]{11})/,
      /youtube\.com\/embed\/([A-Za-z0-9_-]{11})/,
      /music\.youtube\.com\/watch\?.*v=([A-Za-z0-9_-]{11})/
    ];
    for (const p of patterns) {
      const m = url.match(p);
      if (m) return m[1];
    }
    if (/^[A-Za-z0-9_-]{11}$/.test(url.trim())) return url.trim();
    return null;
  }

  function ensureYTPlayer() {
    return new Promise((resolve) => {
      if (ytPlayer) { resolve(); return; }
      if (!window.YT || !window.YT.Player) {
        const check = setInterval(() => {
          if (window.YT && window.YT.Player) {
            clearInterval(check);
            createYTPlayer().then(resolve);
          }
        }, 100);
        setTimeout(() => { clearInterval(check); resolve(); }, 10000);
        return;
      }
      createYTPlayer().then(resolve);
    });
  }

  function createYTPlayer() {
    return new Promise((resolve) => {
      if (ytPlayer) { resolve(); return; }
      ytPlayer = new YT.Player('ytHost', {
        height: '1',
        width: '1',
        videoId: '',
        playerVars: {
          autoplay: 0,
          controls: 1,
          playsinline: 1,
          enablejsapi: 1,
          origin: location.origin,
          modestbranding: 1,
          rel: 0,
          iv_load_policy: 3
        },
        events: {
          onReady: () => {
            ytReady = true;
            resolve();
          },
          onStateChange: (e) => {
            if (e.data === 1) {   // playing
              setPlayIcon(true);
            } else if (e.data === 2) { // paused
              setPlayIcon(false);
            } else if (e.data === 0) { // ended
              handleYTEnded();
            }
          }
        }
      });
    });
  }

  function loadYTVideo(videoId) {
    return new Promise(async (resolve) => {
      await ensureYTPlayer();
      if (!ytPlayer) { resolve(false); return; }
      try {
        ytPlayer.loadVideoById(videoId);
        resolve(true);
      } catch (e) { resolve(false); }
    });
  }

  function handleYTEnded() {
    if (!tracks.length) return;
    clearGap();
    setPlayIcon(false);
    stopYTPoll();
    gapTimer = setTimeout(() => {
      gapTimer = null;
      if (loopMode === 'one') {
        if (ytPlayer) { ytPlayer.seekTo(0, true); ytPlayer.playVideo(); }
        return;
      }
      nextTrack(true);
    }, GAP_MS);
  }

  function startYTPoll() {
    stopYTPoll();
    ytPollTimer = setInterval(() => {
      if (!ytPlayer || !currentIsYT) return;
      const cur = ytPlayer.getCurrentTime();
      const dur = ytPlayer.getDuration();
      if (isFinite(dur) && dur > 0) {
        els.seek.value = Math.round((cur / dur) * 1000);
        els.durTime.textContent = fmt(dur);
      }
      els.curTime.textContent = fmt(cur);
      updatePositionState();
    }, 500);
  }
  function stopYTPoll() {
    if (ytPollTimer) { clearInterval(ytPollTimer); ytPollTimer = null; }
  }

  function isPlaying() {
    if (currentIsYT) return ytPlayer && ytPlayer.getPlayerState() === 1;
    return !els.audio.paused;
  }
  function getCurrentTime() {
    if (currentIsYT) return ytPlayer ? ytPlayer.getCurrentTime() : 0;
    return els.audio.currentTime || 0;
  }
  function getDuration() {
    if (currentIsYT) return ytPlayer ? ytPlayer.getDuration() : 0;
    return els.audio.duration || 0;
  }

  /* ------------------------------------------------------------------ */
  /*  Rendering                                                          */
  /* ------------------------------------------------------------------ */
  function render() {
    const scrollTop = els.playlist.scrollTop;
    els.playlist.innerHTML = '';
    if (!tracks.length) {
      const li = document.createElement('li');
      li.className = 'empty';
      li.textContent = 'No tracks';
      els.playlist.appendChild(li);
    } else {
      const frag = document.createDocumentFragment();
      tracks.forEach((track, i) => {
        const li = document.createElement('li');
        li.className = 'track' + (i === current ? ' active' : '');
        li.dataset.index = String(i);

        const idx = document.createElement('span');
        idx.className = 'idx';
        idx.textContent = i === current ? '▶' : String(i + 1);

        const name = document.createElement('span');
        name.className = 'name';
        name.textContent = track.name;
        name.title = track.name;

        if (track.type === 'youtube') {
          const tag = document.createElement('span');
          tag.className = 'yt-tag';
          tag.textContent = 'YT';
          li.append(idx, name, tag);
        } else {
          li.append(idx, name);
        }

        if (editing) {
          const upBtn = document.createElement('button');
          upBtn.className = 'move move-up';
          upBtn.type = 'button';
          upBtn.textContent = '↑';
          upBtn.disabled = i === 0;
          upBtn.title = 'Move up';
          upBtn.setAttribute('aria-label', 'Move up');

          const downBtn = document.createElement('button');
          downBtn.className = 'move move-down';
          downBtn.type = 'button';
          downBtn.textContent = '↓';
          downBtn.disabled = i === tracks.length - 1;
          downBtn.title = 'Move down';
          downBtn.setAttribute('aria-label', 'Move down');

          const remove = document.createElement('button');
          remove.className = 'remove';
          remove.type = 'button';
          remove.textContent = '✕';
          remove.title = 'Remove track';
          remove.setAttribute('aria-label', 'Remove track');

          li.append(upBtn, downBtn, remove);
        } else {
          const noteBtn = document.createElement('button');
          noteBtn.className = 'note' + (notesMap.get(track.key) ? ' has' : '');
          noteBtn.type = 'button';
          noteBtn.textContent = 'N';
          noteBtn.title = notesMap.get(track.key) ? 'View note' : 'Add note';
          noteBtn.setAttribute('aria-label', 'Notes');

          const remove = document.createElement('button');
          remove.className = 'remove';
          remove.type = 'button';
          remove.textContent = '✕';
          remove.title = 'Remove track';
          remove.setAttribute('aria-label', 'Remove track');

          li.append(noteBtn, remove);
        }
        frag.appendChild(li);
      });
      els.playlist.appendChild(frag);
    }
    els.playlist.scrollTop = scrollTop;
    updateNowPlaying();
  }
  function renderLoop() {
    els.loopBtn.classList.toggle('on', loopMode !== 'off');
    els.loopBtn.querySelector('.loop-icon').textContent = loopMode === 'one' ? '🔂' : '🔁';
    els.loopBtn.querySelector('.loop-label').textContent = LOOP_LABELS[loopMode];
    els.loopBtn.title = 'Repeat: ' + LOOP_LABELS[loopMode];
  }

  /* ------------------------------------------------------------------ */
  /*  Playlist management                                                */
  /* ------------------------------------------------------------------ */
  function addFiles(fileList) {
    if (!fileList || !fileList.length) return;
    const files = Array.from(fileList).filter(
      f => (f.type && f.type.startsWith('audio/')) || AUDIO_EXT.test(f.name)
    );
    if (!files.length) return;
    const wasEmpty = tracks.length === 0;
    const existing = new Set(tracks.map(t => t.key));
    let added = 0;
    files.forEach(file => {
      const key = `${file.name}|${file.size}|${file.lastModified}`;
      if (existing.has(key)) return;
      existing.add(key);
      const id = ++uid;
      const name = file.name.replace(/\.[^.]+$/, '');
      tracks.push({ id, key, name, type: 'local', url: URL.createObjectURL(file) });
      added++;
      dbPut({ key, name, blob: file, ts: Date.now() + id }).catch(() => {});
    });
    if (!added) return;
    saveOrder();
    render();
    if (wasEmpty) playTrack(0, false);
    toast(added + ' track' + (added === 1 ? '' : 's') + ' added');
  }

  async function addYouTubeTrack(videoId, rawUrl) {
    if (!videoId) { toast('Invalid YouTube link'); return; }
    const key = 'yt:' + videoId;
    if (tracks.some(t => t.key === key)) { toast('Already in playlist'); return; }

    const fetchedTitle = await fetchYouTubeTitle(videoId);
    const name = fetchedTitle || ('YouTube · ' + videoId);

    const id = ++uid;
    tracks.push({ id, key, name, type: 'youtube', videoId });
    saveOrder();
    setPut({ key: 'ytrack:' + key, track: { name, key, type: 'youtube', videoId } })
      .catch(() => {});
    render();
    if (tracks.length === 1) playTrack(0, false);
    toast('YouTube track added');
  }

  function removeTrack(index) {
    if (index < 0 || index >= tracks.length) return;
    const wasCurrent = index === current;
    const removed = tracks[index];
    const removedKey = removed.key;
    notesMap.delete(removedKey);
    setDelete('note:' + removedKey).catch(() => {});
    if (removed.type === 'local') {
      dbDelete(removedKey).catch(() => {});
      URL.revokeObjectURL(removed.url);
    } else if (removed.type === 'youtube') {
      setDelete('ytrack:' + removedKey).catch(() => {});
    }
    tracks.splice(index, 1);
    saveOrder();
    if (!tracks.length) {
      current = -1;
      clearGap();
      stopYTPoll();
      els.audio.pause();
      els.audio.removeAttribute('src');
      els.audio.load();
      if (ytPlayer) { try { ytPlayer.stopVideo(); } catch (e) {} }
      currentIsYT = false;
      els.seek.value = 0;
      els.curTime.textContent = '0:00';
      els.durTime.textContent = '0:00';
      setPlayIcon(false);
      render();
      updateMediaSession();
      return;
    }
    if (wasCurrent) {
      clearGap();
      stopYTPoll();
      current = -1;
      playTrack(Math.min(index, tracks.length - 1), false);
    } else if (index < current) {
      current--;
    }
    render();
    updateMediaSession();
  }

  function clearAll() {
    if (!tracks.length) return;
    dbClear().catch(() => {});
    setDelete('order').catch(() => {});
    for (const key of notesMap.keys()) {
      setDelete('note:' + key).catch(() => {});
    }
    notesMap.clear();
    tracks.forEach(t => {
      if (t.type === 'local') URL.revokeObjectURL(t.url);
      else if (t.type === 'youtube') setDelete('ytrack:' + t.key).catch(() => {});
    });
    tracks = [];
    current = -1;
    currentIsYT = false;
    clearGap();
    stopYTPoll();
    els.audio.pause();
    els.audio.removeAttribute('src');
    els.audio.load();
    if (ytPlayer) { try { ytPlayer.stopVideo(); } catch (e) {} }
    els.seek.value = 0;
    els.curTime.textContent = '0:00';
    els.durTime.textContent = '0:00';
    setPlayIcon(false);
    render();
    updateMediaSession();
    toast('Playlist cleared');
  }

  /* ------------------------------------------------------------------ */
  /*  Playback                                                           */
  /* ------------------------------------------------------------------ */
  function clearGap(){
    if (gapTimer) { clearTimeout(gapTimer); gapTimer = null; }
  }

  // In playTrack
async function playTrack(index, autoplay = true) {
  // … stop previous playback …
  current = index;
  const t = tracks[index];
  currentIsYT = t.type === 'youtube';

  if (currentIsYT) {
    // … YouTube logic unchanged …
  } else {
    // Only load the audio resource if we're actually starting playback
    if (autoplay) {
      els.audio.src = t.url;
      const p = els.audio.play();
      if (p && p.catch) p.catch(() => {});
    } else {
      // Do NOT set els.audio.src here; just update the UI
      els.audio.pause();
      setPlayIcon(false);
    }
  }
  // … UI updates …
}

// In togglePlay (when starting playback)
function togglePlay() {
  // … existing checks …
  if (currentIsYT) { /* … */ }
  else {
    if (els.audio.paused) {
      // If the audio element has no src yet, assign it now
      if (!els.audio.src) {
        const t = tracks[current];
        els.audio.src = t.url;
      }
      const p = els.audio.play();
      if (p && p.catch) p.catch(() => {});
    } else {
      els.audio.pause();
    }
  }
}

  function nextTrack(auto = false) {
    if (!tracks.length) return;
    clearGap();
    if (current === -1) { playTrack(0); return; }
    if (current < tracks.length - 1) { playTrack(current + 1); return; }
    if (auto && loopMode === 'off') {
      setPlayIcon(false);
      return;
    }
    playTrack(0);
  }

  function prevTrack() {
    if (!tracks.length) return;
    clearGap();
    if (current !== -1 && getCurrentTime() > 3) {
      if (currentIsYT && ytPlayer) ytPlayer.seekTo(0, true);
      else els.audio.currentTime = 0;
      return;
    }
    if (current > 0) playTrack(current - 1);
    else if (current === 0) playTrack(tracks.length - 1);
    else playTrack(0);
  }

  function seekBy(delta) {
    if (!tracks.length) return;
    const d = getDuration();
    if (!isFinite(d) || d <= 0) return;
    const newTime = Math.min(d, Math.max(0, getCurrentTime() + delta));
    if (currentIsYT && ytPlayer) ytPlayer.seekTo(newTime, true);
    else els.audio.currentTime = newTime;
  }

  /* ------------------------------------------------------------------ */
  /*  Export / Import                                                    */
  /* ------------------------------------------------------------------ */
  async function exportPlaylist() {
    if (!tracks.length) { toast('Nothing to export'); return; }
    els.exportBtn.disabled = true;
    els.exportBtn.textContent = '⏳ Preparing…';
    try {
      const out = {
        app: 'audio-playlist',
        version: 4,
        exported: new Date().toISOString(),
        order: tracks.map(t => t.key),
        settings: {},
        notes: [],
        tracks: []
      };

      for (const t of tracks) {
        if (t.type === 'youtube') {
          out.tracks.push({
            name: t.name,
            key:  t.key,
            type: 'youtube',
            videoId: t.videoId
          });
          continue;
        }
        try {
          const rec = await new Promise((res, rej) => {
            db().then(d => {
              const r = d.transaction(STORE, 'readonly').objectStore(STORE).get(t.key);
              r.onsuccess = () => res(r.result);
              r.onerror   = () => rej(r.error);
            }).catch(rej);
          });
          if (rec && rec.blob) {
            out.tracks.push({
              name: rec.name,
              key:  rec.key,
              type: 'local',
              fileType: rec.blob.type || 'audio/mpeg',
              audio: await blobToDataUrl(rec.blob)
            });
          }
        } catch (e) {}
      }

      notesMap.forEach((text, key) => {
        if (text) out.notes.push({ key, text });
      });

      for (const k of ['alpha', 'dim', 'background', 'lockscreen', 'icon']) {
        try {
          const s = await setGet(k);
          if (!s) continue;
          if (s.blob) {
            out.settings[k] = { dataUrl: await blobToDataUrl(s.blob), type: s.type || '' };
          } else if (typeof s.value === 'number') {
            out.settings[k] = { value: s.value };
          }
        } catch (e) {}
      }

      const json = JSON.stringify(out);
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const stamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
      a.href = url;
      a.download = `playlist-${stamp}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
      toast('Exported ' + out.tracks.length + ' track' + (out.tracks.length === 1 ? '' : 's'));
    } catch (e) {
      toast('Export failed: ' + (e && e.message ? e.message : 'unknown'));
    } finally {
      els.exportBtn.disabled = false;
      els.exportBtn.textContent = '⬇ Export playlist';
    }
  }

  async function importPlaylist(file) {
    els.importBtn.disabled = true;
    els.importBtn.textContent = '⏳ Importing…';
    try {
      const text = await file.text();
      const data = JSON.parse(text);
      if (!data || !Array.isArray(data.tracks)) throw new Error('Not a playlist backup');

      let added = 0, skipped = 0;
      const existing = new Set(tracks.map(t => t.key));
      for (const tr of data.tracks) {
        try {
          const key = tr.key || (tr.type === 'youtube' ? 'yt:' + tr.videoId : `${tr.name || 'track'}|${Date.now()}`);
          if (existing.has(key)) { skipped++; continue; }

          if (tr.type === 'youtube' && tr.videoId) {
            existing.add(key);
            const id = ++uid;
            const name = (tr.name || 'YouTube · ' + tr.videoId).toString();
            tracks.push({ id, key, name, type: 'youtube', videoId: tr.videoId });
            await setPut({ key: 'ytrack:' + key, track: { name, key, type: 'youtube', videoId: tr.videoId } });
            added++;
            continue;
          }

          if (!tr.audio) { skipped++; continue; }
          const blob = dataUrlToBlob(tr.audio);
          const localKey = tr.key || `${tr.name || 'track'}|${blob.size}|${Date.now() + Math.random()}`;
          if (existing.has(localKey)) { skipped++; continue; }
          existing.add(localKey);
          const id = ++uid;
          const name = (tr.name || 'Untitled').toString();
          tracks.push({ id, key: localKey, name, type: 'local', url: URL.createObjectURL(blob) });
          await dbPut({ key: localKey, name, blob, ts: Date.now() + id });
          added++;
        } catch (e) { skipped++; }
      }

      if (Array.isArray(data.notes)) {
        for (const n of data.notes) {
          if (!n || !n.key) continue;
          notesMap.set(n.key, n.text || '');
          try { await setPut({ key: 'note:' + n.key, text: n.text || '' }); } catch (e) {}
        }
      }

      if (Array.isArray(data.order) && data.order.length) {
        const orderMap = new Map(data.order.map((k, i) => [k, i]));
        tracks.sort((a, b) => {
          const ai = orderMap.has(a.key) ? orderMap.get(a.key) : Number.MAX_SAFE_INTEGER;
          const bi = orderMap.has(b.key) ? orderMap.get(b.key) : Number.MAX_SAFE_INTEGER;
          return ai - bi;
        });
      }
      saveOrder();

      const s = data.settings || {};
      if (s.alpha && typeof s.alpha.value === 'number') {
        applyAlpha(s.alpha.value);
        await setPut({ key: 'alpha', value: s.alpha.value }).catch(() => {});
      }
      if (s.dim && typeof s.dim.value === 'number') {
        applyDim(s.dim.value);
        await setPut({ key: 'dim', value: s.dim.value }).catch(() => {});
      }
      if (s.background && s.background.dataUrl) {
        try {
          const blob = dataUrlToBlob(s.background.dataUrl);
          await applyBackground(blob);
          await setPut({ key: 'background', blob, type: s.background.type || blob.type }).catch(() => {});
        } catch (e) {}
      }
      if (s.lockscreen && s.lockscreen.dataUrl) {
        try {
          const blob = dataUrlToBlob(s.lockscreen.dataUrl);
          await applyLockImage(blob);
          await setPut({ key: 'lockscreen', blob, type: s.lockscreen.type || blob.type }).catch(() => {});
        } catch (e) {}
      }
      if (s.icon && s.icon.dataUrl) {
        try {
          const blob = dataUrlToBlob(s.icon.dataUrl);
          await applyIcon(blob);
          await setPut({ key: 'icon', blob, type: s.icon.type || blob.type }).catch(() => {});
        } catch (e) {}
      }

      render();
      updateMediaSession();
      if (tracks.length && current === -1) playTrack(0, false);

      const msg = added
        ? `Imported ${added} track${added === 1 ? '' : 's'}` + (skipped ? ` · ${skipped} skipped` : '')
        : 'Nothing new to import';
      toast(msg, 2800);
    } catch (e) {
      toast('Import failed: ' + (e && e.message ? e.message : 'invalid file'), 3200);
    } finally {
      els.importBtn.disabled = false;
      els.importBtn.textContent = '⬆ Import playlist';
    }
  }

  /* ------------------------------------------------------------------ */
  /*  Events                                                             */
  /* ------------------------------------------------------------------ */
  els.settingsBtn.addEventListener('click', openSidebar);
  els.closeSidebar.addEventListener('click', closeSidebar);
  els.scrim.addEventListener('click', closeSidebar);

  els.editBtn.addEventListener('click', () => setEditMode(!editing));

  els.noteScrim.addEventListener('click', closeNoteSidebar);
  els.noteClose.addEventListener('click', closeNoteSidebar);
  els.noteEditBtn.addEventListener('click', () => setNoteEditMode(true));
  els.noteSave.addEventListener('click', saveNote);
  els.noteDelete.addEventListener('click', deleteNote);

  els.hideBtn.addEventListener('click', () => {
    setMinimal(!document.body.classList.contains('minimal'));
  });

  // Add URL button + modal
  els.addUrlBtn.addEventListener('click', () => {
    els.urlInput.value = '';
    els.urlModal.hidden = false;
    setTimeout(() => { try { els.urlInput.focus(); } catch (e) {} }, 30);
  });
  els.urlCancel.addEventListener('click', () => { els.urlModal.hidden = true; });
  els.urlAdd.addEventListener('click', () => {
    const raw = els.urlInput.value.trim();
    const videoId = parseYouTubeId(raw);
    if (!videoId) { toast('Could not find a YouTube video ID'); return; }
    els.urlModal.hidden = true;
    addYouTubeTrack(videoId, raw);
  });
  els.urlInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); els.urlAdd.click(); }
  });
  els.urlModal.addEventListener('click', (e) => {
    if (e.target === els.urlModal) els.urlModal.hidden = true;
  });

  els.fileInput.addEventListener('change', e => {
    addFiles(e.target.files);
    e.target.value = '';
  });

  // Background
  els.bgBtn.addEventListener('click', () => els.bgInput.click());
  els.bgInput.addEventListener('change', async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file || !file.type || !file.type.startsWith('image/')) return;
    await applyBackground(file);
    try { await setPut({ key: 'background', blob: file, type: file.type }); } catch (err) {}
  });
  els.bgClearBtn.addEventListener('click', async () => {
    await applyBackground(null);
    try { await setDelete('background'); } catch (err) {}
  });

  // Lock screen
  els.lockBtn.addEventListener('click', () => els.lockInput.click());
  els.lockInput.addEventListener('change', async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file || !file.type || !file.type.startsWith('image/')) return;
    await applyLockImage(file);
    try { await setPut({ key: 'lockscreen', blob: file, type: file.type }); } catch (err) {}
  });
  els.lockClearBtn.addEventListener('click', async () => {
    await applyLockImage(null);
    try { await setDelete('lockscreen'); } catch (err) {}
  });

  // Icon
  els.iconBtn.addEventListener('click', () => els.iconInput.click());
  els.iconInput.addEventListener('change', async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file || !file.type || !file.type.startsWith('image/')) return;
    await applyIcon(file);
    try { await setPut({ key: 'icon', blob: file, type: file.type }); } catch (err) {}
  });
  els.iconClearBtn.addEventListener('click', async () => {
    await applyIcon(null);
    try { await setDelete('icon'); } catch (err) {}
  });

  // Export / import
  els.exportBtn.addEventListener('click', exportPlaylist);
  els.importBtn.addEventListener('click', () => els.importInput.click());
  els.importInput.addEventListener('change', async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    await importPlaylist(file);
  });

  // Sliders
  let dimSaveTimer = null;
  els.dim.addEventListener('input', () => {
    const v = Number(els.dim.value);
    applyDim(v);
    clearTimeout(dimSaveTimer);
    dimSaveTimer = setTimeout(() => {
      setPut({ key: 'dim', value: v }).catch(() => {});
    }, 250);
  });
  let alphaSaveTimer = null;
  els.alpha.addEventListener('input', () => {
    const v = Number(els.alpha.value);
    applyAlpha(v);
    clearTimeout(alphaSaveTimer);
    alphaSaveTimer = setTimeout(() => {
      setPut({ key: 'alpha', value: v }).catch(() => {});
    }, 250);
  });

  // Drag & drop
  ['dragenter', 'dragover'].forEach(evt => {
    els.drop.addEventListener(evt, e => {
      e.preventDefault();
      els.drop.classList.add('over');
    });
  });
  ['dragleave', 'dragend', 'drop'].forEach(evt => {
    els.drop.addEventListener(evt, e => {
      e.preventDefault();
      els.drop.classList.remove('over');
    });
  });
  els.drop.addEventListener('drop', e => {
    if (e.dataTransfer && e.dataTransfer.files) addFiles(e.dataTransfer.files);
  });
  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('drop', e => e.preventDefault());

  els.playlist.addEventListener('click', e => {
    const li = e.target.closest('.track');
    if (!li) return;
    const index = Number(li.dataset.index);
    if (e.target.closest('.remove')) { removeTrack(index); return; }
    if (e.target.closest('.move-up'))   { moveTrack(index, -1); return; }
    if (e.target.closest('.move-down')) { moveTrack(index, 1);  return; }
    if (editing) return;
    if (e.target.closest('.note')) { openNoteSidebar(index); return; }
    if (index === current) togglePlay();
    else playTrack(index);
  });

  els.clearBtn.addEventListener('click', clearAll);
  els.playBtn.addEventListener('click', togglePlay);
  els.nextBtn.addEventListener('click', () => nextTrack(false));
  els.prevBtn.addEventListener('click', prevTrack);

  els.loopBtn.addEventListener('click', () => {
    loopMode = loopMode === 'off' ? 'all' : loopMode === 'all' ? 'one' : 'off';
    renderLoop();
  });

  // Audio events (local files)
  els.audio.addEventListener('play', () => {
    if (!currentIsYT) setPlayIcon(true);
    if ('mediaSession' in navigator) {
      try { navigator.mediaSession.playbackState = 'playing'; } catch (e) {}
    }
  });
  els.audio.addEventListener('pause', () => {
    if (!currentIsYT) setPlayIcon(false);
    if ('mediaSession' in navigator && current >= 0) {
      try { navigator.mediaSession.playbackState = 'paused'; } catch (e) {}
    }
  });
  els.audio.addEventListener('loadedmetadata', () => {
    if (currentIsYT) return;
    els.durTime.textContent = fmt(els.audio.duration);
    els.seek.value = 0;
    updatePositionState();
  });
  els.audio.addEventListener('timeupdate', () => {
    if (currentIsYT) return;
    const d = els.audio.duration;
    if (isFinite(d) && d > 0) {
      els.seek.value = Math.round((els.audio.currentTime / d) * 1000);
      els.durTime.textContent = fmt(d);
    }
    els.curTime.textContent = fmt(els.audio.currentTime);
    updatePositionState();
  });

  els.audio.addEventListener('ended', () => {
    if (currentIsYT) return;
    if (!tracks.length) return;
    clearGap();
    setPlayIcon(false);
    gapTimer = setTimeout(() => {
      gapTimer = null;
      if (loopMode === 'one') {
        els.audio.currentTime = 0;
        const p = els.audio.play();
        if (p && typeof p.catch === 'function') p.catch(() => {});
        return;
      }
      nextTrack(true);
    }, GAP_MS);
  });

  els.audio.addEventListener('error', () => {
    if (current >= 0 && !currentIsYT) els.nowSub.textContent = '⚠ Could not play this file';
  });

  els.seek.addEventListener('input', () => {
    const d = getDuration();
    if (!isFinite(d) || d <= 0) return;
    const newTime = (Number(els.seek.value) / 1000) * d;
    if (currentIsYT && ytPlayer) ytPlayer.seekTo(newTime, true);
    else els.audio.currentTime = newTime;
    els.curTime.textContent = fmt(newTime);
    updatePositionState();
  });

  els.volume.addEventListener('input', () => {
    const v = Number(els.volume.value);
    els.audio.volume = v;
    if (ytPlayer && ytReady) {
      try { ytPlayer.setVolume(v * 100); } catch (e) {}
    }
  });

  // Escape handling
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (!els.urlModal.hidden) { els.urlModal.hidden = true; return; }
      if (els.noteSidebar.classList.contains('open')) { closeNoteSidebar(); return; }
      if (els.sidebar.classList.contains('open')) closeSidebar();
    }
  });

  // Keyboard shortcuts
  document.addEventListener('keydown', e => {
    if (els.noteSidebar.classList.contains('open')) return;
    if (!els.urlModal.hidden) return;
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || tag === 'button' || e.target.isContentEditable) return;
    switch (e.code) {
      case 'Space':      e.preventDefault(); togglePlay(); break;
      case 'ArrowRight': e.preventDefault(); seekBy(5);    break;
      case 'ArrowLeft':  e.preventDefault(); seekBy(-5);   break;
      case 'KeyN':       nextTrack(false); break;
      case 'KeyP':       prevTrack();      break;
      case 'KeyL':
        loopMode = loopMode === 'off' ? 'all' : loopMode === 'all' ? 'one' : 'off';
        renderLoop();
        break;
      case 'KeyH':
        setMinimal(!document.body.classList.contains('minimal'));
        break;
    }
  });

  /* ------------------------------------------------------------------ */
  /*  Init                                                               */
  /* ------------------------------------------------------------------ */
  rebuildIconAssets();

  if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persist().catch(() => {});
  }

  els.audio.volume = 1;
  renderLoop();
  render();
  setPlayIcon(false);
  setMinimal(false);
  initMediaSession();
  updateMediaSession();
  applyAlpha(Number(els.alpha.value));
  applyDim(Number(els.dim.value));

  (async () => {
    try {
      const ic = await setGet('icon');
      if (ic && ic.blob) await applyIcon(ic.blob);
    } catch (e) {}

    // Restore notes and persisted YouTube tracks from settings store
    try {
      const all = await setAll();
      all.forEach(r => {
        if (!r || !r.key) return;
        if (r.key.indexOf('note:') === 0) {
          notesMap.set(r.key.slice(5), r.text || '');
        } else if (r.key.indexOf('ytrack:') === 0 && r.track) {
          const tr = r.track;
          if (tr && tr.videoId && !tracks.some(t => t.key === tr.key)) {
            tracks.push({
              id: ++uid, key: tr.key, name: tr.name,
              type: 'youtube', videoId: tr.videoId
            });
          }
        }
      });
    } catch (e) {}

    try {
      const recs = await dbAll();
      if (recs.length) {
        recs.sort((a, b) => (a.ts || 0) - (b.ts || 0));
        recs.forEach(r => tracks.push({
          id: ++uid, key: r.key, name: r.name, type: 'local', url: URL.createObjectURL(r.blob)
        }));
      }
    } catch (e) {}

    // Apply saved order for both local and YouTube tracks
    try {
      const orderRec = await setGet('order');
      if (orderRec && Array.isArray(orderRec.keys)) {
        const orderMap = new Map(orderRec.keys.map((k, i) => [k, i]));
        tracks.sort((a, b) => {
          const ai = orderMap.has(a.key) ? orderMap.get(a.key) : Number.MAX_SAFE_INTEGER;
          const bi = orderMap.has(b.key) ? orderMap.get(b.key) : Number.MAX_SAFE_INTEGER;
          return ai - bi;
        });
      }
    } catch (e) {}

    if (tracks.length) {
      render();
      playTrack(0, false);
    }

    try {
      const bg = await setGet('background');
      if (bg && bg.blob) await applyBackground(bg.blob);
    } catch (e) {}

    try {
      const lk = await setGet('lockscreen');
      if (lk && lk.blob) await applyLockImage(lk.blob);
    } catch (e) {}

    try {
      const a = await setGet('alpha');
      if (a && typeof a.value === 'number') applyAlpha(a.value);
    } catch (e) {}

    try {
      const d = await setGet('dim');
      if (d && typeof d.value === 'number') applyDim(d.value);
    } catch (e) {}
  })();
})();
</script>
</body>
</html>
